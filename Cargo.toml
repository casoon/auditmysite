[package]
name = "auditmysite"
version = "1.5.0"
edition = "2021"
authors = ["Casoon"]
description = "Resource-efficient WCAG 2.1 AA (+ select 2.2 criteria) Accessibility Checker in Rust"
license = "MIT"
repository = "https://github.com/casoon/auditmysite"
homepage = "https://www.casoon.de"
documentation = "https://auditmysite.casoon.dev/"
keywords = ["accessibility", "wcag", "a11y", "audit", "chrome"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"

[dependencies]
# Browser automation via Chrome DevTools Protocol
chromiumoxide = { version = "0.8", default-features = false, features = ["tokio-runtime"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "fs", "signal"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Output formatting
colored = "2.0"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
runemark = { version = "0.3.1", features = ["progress"] }
console = "0.16"

# URL handling
url = "2.5"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for sitemap fetching and Chromium download)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }

# Zip extraction for Chromium installer
zip = "2.2"

# Home directory detection
dirs = "5.0"

# Config file parsing
toml = "0.8"

# Local HTML5 validation (replaces remote W3C/Nu validator)
html5ever = "0.27"
markup5ever_rcdom = "0.3"

# Deep HTML5 spec-conformance checking (RelaxNG + Schematron), scored module
html-conform = "0.2.1"

# i18n (Project Fluent)
fluent-bundle = "0.15"
unic-langid = "0.9"

# PDF report generation via Typst.
renderreport = { version = "0.5.2", optional = true }
# Pre-crops the mobile device-preview screenshot for the PDF (see
# register_page_screenshot_assets) — already in the dependency tree
# transitively via renderreport's own image handling.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# C2PA (Content Credentials) manifest reading for the ai-transparency module.
# default-features = false drops the crate's default `openssl` (native OpenSSL,
# avoided in favor of the pure-Rust crypto backend) and `default_http` (pulls in
# reqwest/ureq/wasi/wstd HTTP clients for online OCSP/trust-list/remote-manifest
# fetching) — this module only reads manifests already embedded in fetched image
# bytes and must stay fully offline, never phoning out on its own.
c2pa = { version = "0.90.3", optional = true, default-features = false, features = ["rust_native_crypto"] }

# DNS record queries (CAA/DNSKEY/MX/TXT) for the opt-in network::dns module (#545).
hickory-resolver = "0.26.1"

# Content hashing for duplicate-asset detection (#551, performance::coverage).
sha2 = "0.10"
a11y-report = "0.6.0"
a11y-dom = "0.6.0"
a11y-rules = "0.6.0"

[dev-dependencies]
tempfile = "3"
jsonschema = "0.18"
lopdf = "0.45"
insta = { version = "1", features = ["json"] }

[profile.release]
opt-level = 3
# thin LTO + 8 codegen-units instead of fat LTO + 1: far less peak RAM at
# link time on this crate graph (chromiumoxide + renderreport/Typst stack),
# at the cost of a slightly larger/less-optimized binary.
lto = "thin"
codegen-units = 8
strip = true

[[bin]]
name = "auditmysite"
path = "src/main.rs"

[features]
default = ["pdf"]
pdf = ["dep:renderreport", "dep:image"]
# Enables the heavy PDF smoke tests (Typst rendering). Run separately:
#   cargo test --features pdf_test -- --test-threads=1
pdf_test = ["pdf"]
# Opt-in C2PA image-provenance check (EU AI Act Art. 50 transparency duties).
# Not in `default` — pulls in real crypto dependencies (ed25519-dalek, p256/
# p384, rsa) purely for a niche, legally-experimental check. Requires both this
# build-time feature AND the runtime --ai-transparency flag to actually run.
ai-transparency = ["dep:c2pa"]
