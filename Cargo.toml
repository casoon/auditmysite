[package]
name = "auditmysite"
version = "2.0.2"
edition = "2021"
authors = ["Casoon"]
description = "Resource-efficient WCAG 2.2 AA Accessibility Checker in Rust"
license = "MIT"
repository = "https://github.com/casoon/auditmysite"
homepage = "https://casoon.github.io/auditmysite/"
documentation = "https://casoon.github.io/auditmysite/"
keywords = ["accessibility", "wcag", "a11y", "audit", "chrome"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"
# Dev, CI and agent tooling, tests and extra docs are not needed to build or
# use the crate; everything `include_str!`/`include_bytes!` reads lives under
# src/, assets/ and locales/. Patterns
# are anchored with `/`: an unanchored `tests/` would also drop src/**/tests/.
exclude = [
    "/.claude/",
    "/.github/",
    "/.githooks/",
    "/docs/",
    "/scripts/",
    "/tests/",
    "/site/",
    "/assets/casts/",
    "/rust-toolchain.toml",
]

[dependencies]
# Browser automation via Chrome DevTools Protocol
chromiumoxide = { version = "0.8", default-features = false, features = ["tokio-runtime"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "fs", "signal"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1.0"
thiserror = "2"

# Output formatting
colored = "3"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
runemark = { version = "0.10", features = ["progress"] }
console = "0.16"

# URL handling
url = "2.5"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for sitemap fetching and Chromium download)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }

# Zip extraction for Chromium installer
zip = "9"

# Home directory detection
dirs = "7"

# Config file parsing
toml = "1"

# Local HTML5 validation (replaces remote W3C/Nu validator)
html5ever = "0.40"
markup5ever_rcdom = "0.40"

# Deep HTML5 spec-conformance checking (RelaxNG + Schematron), scored module
html-conform = "0.5.0"

# i18n (Project Fluent)
fluent-bundle = "0.16"
unic-langid = "0.9"

# PDF report generation via Typst.
renderreport = { version = "0.7.1", optional = true }
# Pre-crops the mobile device-preview screenshot for the PDF (see
# register_page_screenshot_assets) — already in the dependency tree
# transitively via renderreport's own image handling.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# Content hashing for duplicate-asset detection (#551, performance::coverage).
sha2 = "0.11"
a11y-perception = "0.2.1"
a11y-report = "0.29.0"
web-checks = "0.7.0"
accname = "0.29.0"
a11y-dom = "0.29.0"
a11y-rules = "0.29.0"
csp-parse = "0.1.1"
stylesheet-parse = "0.1.1"

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.49", default-features = false }
lopdf = "0.47"
insta = { version = "1", features = ["json"] }
# TLS side of the HTTPS fixture server in tests/common/routing_server.rs
# (#783). Same version and `ring` provider reqwest's rustls-tls already
# builds, so no new crate enters the graph.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Generates the fixture CA and certificates per test run, so no private key
# is committed (#783).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[profile.release]
opt-level = 3
# thin LTO + 8 codegen-units instead of fat LTO + 1: far less peak RAM at
# link time on this crate graph (chromiumoxide + renderreport/Typst stack),
# at the cost of a slightly larger/less-optimized binary.
lto = "thin"
codegen-units = 8
strip = true

[[bin]]
name = "auditmysite"
path = "src/main.rs"

# Maintainer tooling (report-lint, accname-diff, plan, replay, --debug-typ,
# --export-snapshot, #912). `required-features` keeps it out of `cargo install
# auditmysite`, which builds with the default features only.
[[bin]]
name = "auditmysite-dev"
path = "src/bin/auditmysite-dev.rs"
required-features = ["dev-tools"]

[features]
default = ["pdf"]
pdf = ["dep:renderreport", "dep:image"]
# Builds the `auditmysite-dev` maintainer binary (#912). Not a default feature,
# so a user install never contains it.
dev-tools = []
# Enables the heavy PDF smoke tests (Typst rendering). Run separately:
#   cargo test --features pdf_test -- --test-threads=1
pdf_test = ["pdf"]
