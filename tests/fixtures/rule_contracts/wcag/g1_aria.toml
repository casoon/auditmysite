# Rule contracts, package G1 (#783): ARIA attributes and roles, names,
# dialogs, widgets, popover/inert, status messages, label in name.
# Format: tests/fixtures/rule_contracts/README.md.

[[rule]]
id = "aria/attribute-unknown"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=aria/attribute-unknown)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 4.1.2 Name, Role, Value; WAI-ARIA 1.2 section 6.6 (definitions of states and properties)"
capabilities = ["dom", "ax_tree"]
applicability = "Every attribute whose name starts with aria- on an element in the accessibility tree."
expectation = """
Fails for each aria-* attribute that WAI-ARIA does not define (typically a typo such as
aria-describeby): the browser ignores it and the intended relationship or state is lost. Attributes
from the WAI-ARIA 1.3 draft that browsers already map (aria-description, aria-braillelabel, ...) are
defined and pass. Hidden subtrees are not exposed and are out of scope; content that becomes visible
or is changed by script is judged as rendered. One finding per unknown attribute."""
page_level = false
positive = ["aria_attrs_invalid", "aria_attribute_validation"]
negative = ["aria_attrs_valid"]
not_applicable = ["aria_na_plain_article"]

[rule.variants]
visibility = { cases = ["aria_variant_hidden"] }
native_vs_aria = { not_relevant = "The check reads aria-* attributes, which have the same meaning on native and custom elements; there is no native counterpart to vary." }
alternative_labels = { not_relevant = "No accessible name is involved: the rule judges roles, states or relationships, not how an element is labelled." }
frames_shadow_dom = { cases = ["aria_variant_shadow_frame"] }
responsive = { cases = ["aria_variant_responsive"] }
dynamic = { cases = ["aria_variant_dynamic"] }
thresholds = { not_relevant = "Membership in the list of defined attribute names; no threshold." }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "aria/attribute-value-invalid"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=aria/attribute-value-invalid)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 4.1.2 Name, Role, Value; WAI-ARIA 1.2 section 6.7 (value types: true/false, tristate, token, integer, number)"
capabilities = ["dom", "ax_tree"]
applicability = "Every WAI-ARIA state or property with an enumerated, integer or number value type and a non-empty value, on an element in the accessibility tree."
expectation = """
Fails when the value is outside the attribute's value type (aria-pressed="yes",
aria-level="two", aria-expanded="maybe"): user agents fall back to the default and the state is lost.
Valid boundary values pass: "mixed" and "undefined" where the type allows them, decimal and exponent
numbers (2.5, 1e1) for number types. Empty values count as absent. ID references and free strings
are other rules (aria/reference-missing). Hidden subtrees are out of scope."""
page_level = false
positive = ["aria_attrs_invalid", "aria_invalid_attr_value"]
negative = ["aria_attrs_valid"]
not_applicable = ["aria_na_plain_article"]

[rule.variants]
visibility = { cases = ["aria_variant_hidden"] }
native_vs_aria = { not_relevant = "The check reads aria-* attributes, which have the same meaning on native and custom elements; there is no native counterpart to vary." }
alternative_labels = { not_relevant = "No accessible name is involved: the rule judges roles, states or relationships, not how an element is labelled." }
frames_shadow_dom = { cases = ["aria_variant_shadow_frame"] }
responsive = { cases = ["aria_variant_responsive"] }
dynamic = { cases = ["aria_variant_dynamic"] }
thresholds = { cases = ["aria_attrs_valid", "aria_attrs_invalid"] }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "aria/attribute-not-allowed"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=aria/attribute-not-allowed)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 4.1.2 Name, Role, Value; WAI-ARIA 1.2 section 5.2 (supported states and properties per role); ARIA in HTML section 3 (author MUST NOT rules); ACT 5c01ea"
capabilities = ["dom", "ax_tree"]
applicability = "Every non-empty WAI-ARIA attribute on an element in the accessibility tree whose role (explicit or implicit) is defined in WAI-ARIA 1.2."
expectation = """
Fails when the element's role does not support the attribute (aria-selected on a
listitem, aria-checked on role img, aria-expanded on a generic div), and when ARIA in HTML forbids it
on the native element (aria-checked on a native checkbox, aria-valuemax next to max). Attributes the
role supports pass, also on a custom widget whose role takes the state (role=checkbox with
aria-checked) and the treegrid row with aria-expanded. Prohibited naming is
aria/attribute-prohibited, not this id. Hidden subtrees are out of scope."""
page_level = false
positive = ["aria_attrs_invalid", "aria_attribute_validation", "widget_patterns"]
negative = ["aria_attrs_valid", "treegrid_expandable_rows"]
not_applicable = ["aria_na_plain_article"]

[rule.variants]
visibility = { cases = ["aria_variant_hidden"] }
native_vs_aria = { cases = ["aria_attrs_invalid", "aria_attrs_valid"] }
alternative_labels = { not_relevant = "No accessible name is involved: the rule judges roles, states or relationships, not how an element is labelled." }
frames_shadow_dom = { cases = ["aria_variant_shadow_frame"] }
responsive = { cases = ["aria_variant_responsive"] }
dynamic = { cases = ["aria_variant_dynamic"] }
thresholds = { not_relevant = "Presence or membership check against the WAI-ARIA tables; no numeric limit to sit on either side of." }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "aria/attribute-prohibited"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=aria/attribute-prohibited)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 4.1.2 Name, Role, Value; WAI-ARIA 1.2 section 5.2.8.6 (Prohibited states and properties: naming prohibited on caption, code, generic, paragraph, presentation, ...)"
capabilities = ["dom", "ax_tree"]
applicability = "aria-label, aria-labelledby (and aria-roledescription on generic) on an element in the accessibility tree whose role prohibits naming."
expectation = """
Fails for aria-label or aria-labelledby on an element whose role prohibits a name, whether
the role is explicit (role=presentation) or implicit (a <p> is a paragraph): the name is not exposed.
Naming a role that supports it (region, navigation, group) passes. Hidden subtrees are out of scope."""
page_level = false
positive = ["aria_attrs_invalid", "aria_attribute_validation"]
negative = ["aria_attrs_valid"]
not_applicable = ["aria_na_plain_article"]

[rule.variants]
visibility = { cases = ["aria_variant_hidden"] }
native_vs_aria = { cases = ["aria_attrs_invalid", "aria_attribute_validation"] }
alternative_labels = { cases = ["aria_attrs_invalid"] }
frames_shadow_dom = { cases = ["aria_variant_shadow_frame"] }
responsive = { cases = ["aria_variant_responsive"] }
dynamic = { cases = ["aria_variant_dynamic"] }
thresholds = { not_relevant = "Presence or membership check against the WAI-ARIA tables; no numeric limit to sit on either side of." }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "aria/owns-conflict"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=aria/owns-conflict)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 4.1.2 Name, Role, Value; WAI-ARIA 1.2 aria-owns (\"An element's ID MUST NOT be specified in more than one other element's aria-owns attribute at any time\")"
capabilities = ["dom", "ax_tree"]
applicability = "Elements in the accessibility tree with aria-owns."
expectation = """
Fails when an id already owned by one element's aria-owns appears in another element's
aria-owns; the owner is then undetermined. Reported once, at the second owner. Owners of distinct ids
pass. Hidden owners are out of scope; ids compare within one tree (document or shadow root)."""
page_level = false
positive = ["aria_attrs_invalid"]
negative = ["aria_attrs_valid"]
not_applicable = ["aria_na_plain_article"]

[rule.variants]
visibility = { cases = ["aria_variant_hidden"] }
native_vs_aria = { not_relevant = "aria-owns exists only as an ARIA attribute; HTML has no native ownership to compare." }
alternative_labels = { not_relevant = "No accessible name is involved: the rule judges roles, states or relationships, not how an element is labelled." }
frames_shadow_dom = { cases = ["aria_variant_shadow_frame"] }
responsive = { cases = ["aria_variant_responsive"] }
dynamic = { cases = ["aria_variant_dynamic"] }
thresholds = { not_relevant = "The condition is a second owner of the same id; nothing to count beyond that." }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "aria/reference-missing"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=aria/reference-missing)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.3.1 Info and Relationships and SC 4.1.2 Name, Role, Value; WAI-ARIA 1.2 section 6.2 (ID reference values) and aria-controls, aria-errormessage"
capabilities = ["dom"]
applicability = "ID references in aria-labelledby, aria-describedby, aria-controls, aria-owns, aria-activedescendant, aria-details, aria-flowto, aria-errormessage (Markup scope)."
expectation = """
Fails when a referenced id does not exist in the element's tree (document or the same
shadow root; IDREFs do not cross a shadow boundary), and for an empty aria-controls, aria-owns or
aria-activedescendant. A reference to hidden content resolves and passes (accname 1.2 step 2B).
aria-controls on a collapsed control (aria-expanded=false) may point at a popup that is only created
on opening, and aria-errormessage only matters while aria-invalid is true: both pass."""
page_level = false
positive = ["aria_attrs_invalid", "aria_attribute_validation"]
negative = ["aria_attrs_valid"]
not_applicable = ["aria_na_plain_article"]

[rule.variants]
visibility = { cases = ["aria_variant_hidden", "aria_attrs_valid"] }
native_vs_aria = { not_relevant = "ID references exist only as ARIA attributes here; label[for] is judged by the forms rules." }
alternative_labels = { not_relevant = "The rule judges whether a reference resolves, not the resulting name." }
frames_shadow_dom = { cases = ["aria_variant_shadow_frame"] }
responsive = { not_relevant = "The rule reads the whole markup (Markup scope): attributes and ids are the same at every viewport, CSS cannot add or remove them." }
dynamic = { cases = ["aria_variant_dynamic"] }
thresholds = { not_relevant = "Presence or membership check against the WAI-ARIA tables; no numeric limit to sit on either side of." }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "aria/role-invalid"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=aria/role-invalid)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 4.1.2 Name, Role, Value; WAI-ARIA 1.2 section 5.4 (definition of roles) and 7.1 (role attribute, fallback tokens); ACT 674b10"
capabilities = ["dom", "ax_tree"]
applicability = "Non-empty role attributes on elements in the accessibility tree."
expectation = """
Fails when no token of the role attribute is a valid, non-abstract WAI-ARIA (or DPUB/
graphics module) role (role="tabel"): the element keeps its native or generic semantics. A fallback
list whose unknown first token is followed by a valid one (role="upload button") passes, because user
agents take the first valid token (ACT 674b10). Abstract roles are aria/role-abstract. Hidden subtrees
are out of scope."""
page_level = false
positive = ["aria_roles_invalid", "aria_attribute_validation"]
negative = ["aria_roles_valid", "aria_shared_deviations"]
not_applicable = ["aria_na_plain_article"]

[rule.variants]
visibility = { cases = ["aria_variant_hidden"] }
native_vs_aria = { not_relevant = "The role attribute is judged on its own value; the host element does not change validity." }
alternative_labels = { not_relevant = "No accessible name is involved: the rule judges roles, states or relationships, not how an element is labelled." }
frames_shadow_dom = { cases = ["aria_variant_shadow_frame"] }
responsive = { cases = ["aria_variant_responsive"] }
dynamic = { cases = ["aria_variant_dynamic"] }
thresholds = { not_relevant = "Presence or membership check against the WAI-ARIA tables; no numeric limit to sit on either side of." }

[rule.test_strength]
status = "killed"
mutations = []

