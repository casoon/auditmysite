[[rule]]
id = "status/live-overridden"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=status/live-overridden)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 4.1.3 Status Messages; WAI-ARIA 1.2 alert, status, log (implicit aria-live) and aria-live"
capabilities = ["dom", "ax_tree"]
applicability = "Elements in the accessibility tree with role alert, status or log (explicit or implicit, <output> is status) and an aria-live attribute."
expectation = """
Fails for aria-live="off": updates of the status message are not announced. Changing the
urgency (alert with polite, status with assertive) is allowed by ARIA and still announced: review.
The default urgency, stated or implicit, passes; a log may change its urgency; aria-live on an
element without a live role is not this id. Hidden subtrees are out of scope."""
page_level = false
positive = ["aria_dialogs_live_broken", "aria_and_widgets"]
negative = ["aria_dialogs_live_valid"]
not_applicable = ["aria_na_plain_article"]

[rule.variants]
visibility = { cases = ["aria_variant_hidden"] }
native_vs_aria = { cases = ["aria_dialogs_live_broken"] }
alternative_labels = { not_relevant = "No accessible name is involved: the rule judges roles, states or relationships, not how an element is labelled." }
frames_shadow_dom = { cases = ["aria_variant_shadow_frame"] }
responsive = { cases = ["aria_variant_responsive"] }
dynamic = { cases = ["aria_variant_dynamic"] }
thresholds = { not_relevant = "Presence or membership check against the WAI-ARIA tables; no numeric limit to sit on either side of." }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "modern-attribute-misuse"
errored = ["error_page_scripts_sabotaged"]
automation = "automated"
method = "page"
source = "WCAG 2.2 SC 2.1.1 Keyboard and SC 4.1.2 Name, Role, Value; HTML Living Standard, the popover attribute, the inert attribute (focus fixup)"
capabilities = ["dom", "computed_style"]
applicability = "Open popovers and visible role=menu elements in the document and its open shadow roots, and the focused element."
expectation = """
Fails for an open popover that is inert: it is shown but nothing in it can be focused or
operated, and assistive technology does not get it. An open, unnamed popover or visible unnamed menu
is a review: neither HTML nor WAI-ARIA 1.2 requires a name there, but a human should judge whether
the surface is identifiable. Named or closed popovers, hidden menus and named menus pass. Focus left
inside inert content would fail, but HTML's focus fixup moves focus out when content becomes inert,
so a conforming browser never shows it."""
page_level = false
positive = ["aria_widgets_broken", "aria_variant_responsive"]
negative = ["aria_widgets_valid"]
not_applicable = ["aria_na_plain_article"]

[rule.variants]
visibility = { cases = ["aria_variant_hidden"] }
native_vs_aria = { cases = ["aria_widgets_broken", "aria_variant_responsive"] }
alternative_labels = { cases = ["aria_widgets_valid"] }
frames_shadow_dom = { cases = ["aria_variant_shadow_frame"] }
responsive = { cases = ["aria_variant_responsive"] }
dynamic = { cases = ["aria_variant_dynamic"] }
thresholds = { not_relevant = "Open/closed, inert/not inert and named/unnamed are states, not measured values." }

[rule.test_strength]
status = "killed"
[[rule.test_strength.mutations]]
target = "src/wcag/rules/modern_attributes.rs"
change = "invert the inert condition on open popovers"
find = "if (isOpenPopover && el.hasAttribute('inert')) {"
replace = "if (isOpenPopover && !el.hasAttribute('inert')) {"
killed_by = "corpus:aria_widgets_broken,aria_widgets_valid"
[[rule.test_strength.mutations]]
target = "src/wcag/rules/modern_attributes.rs"
change = "stop descending into open shadow roots"
find = "if (el.shadowRoot) walk(el.shadowRoot);"
replace = "if (false) walk(el.shadowRoot);"
killed_by = "corpus:aria_variant_shadow_frame"
[[rule.test_strength.mutations]]
target = "src/wcag/rules/modern_attributes.rs"
change = "escalate the unnamed-surface review to a violation"
find = "'aria-label', null, 'review');"
replace = "'aria-label', null, 'fail');"
killed_by = "corpus:aria_variant_responsive"
[[rule.test_strength.mutations]]
target = "src/wcag/rules/modern_attributes.rs"
change = "drop the visibility condition for menus"
find = "const isMenu = el.getAttribute('role') === 'menu' && isVisible(el);"
replace = "const isMenu = el.getAttribute('role') === 'menu';"
killed_by = "corpus:aria_variant_hidden"
