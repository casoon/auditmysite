[[rule]]
id = "aria/required-parent-missing"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=aria/required-parent-missing)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.3.1 and SC 4.1.2; WAI-ARIA 1.2 section 5.2.7 (Required Context Role); ACT ff89c9"
capabilities = ["dom", "ax_tree"]
applicability = "Elements in the accessibility tree with an explicit role that has a required context role (tab, option, menuitem, row, cell, treeitem, ...), and <li> in a list re-roled to something else."
expectation = """
Fails when the nearest ancestor with a role (generic and presentational ancestors are
skipped, aria-owns counts as parent) is not one of the required context roles: a tab outside a
tablist, a menuitem outside menu/menubar/group, a tab under a native <li> of a list re-roled as
tablist. A tab inside its tablist, also through a generic wrapper or via aria-owns, passes. A
listitem's context is lists/item-outside-list, not this id. Hidden subtrees are out of scope."""
page_level = false
positive = ["aria_roles_invalid", "aria_attribute_validation", "iframe_widget_rules", "aria_naming_roles"]
negative = ["aria_roles_valid"]
not_applicable = ["aria_na_plain_article"]

[rule.variants]
visibility = { cases = ["aria_variant_hidden"] }
native_vs_aria = { cases = ["iframe_widget_rules"] }
alternative_labels = { not_relevant = "No accessible name is involved: the rule judges roles, states or relationships, not how an element is labelled." }
frames_shadow_dom = { cases = ["iframe_widget_rules", "aria_variant_shadow_frame"] }
responsive = { cases = ["aria_variant_responsive"] }
dynamic = { cases = ["aria_variant_dynamic"] }
thresholds = { not_relevant = "Presence or membership check against the WAI-ARIA tables; no numeric limit to sit on either side of." }

