[[rule]]
id = "aria/role-redundant"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=aria/role-redundant)"]
automation = "automated"
method = "shared"
source = "ARIA in HTML section 2 (\"Authors SHOULD NOT set the role to the implicit role of the element\"); best practice under WCAG 2.2 SC 4.1.2, not a failure of it"
capabilities = ["dom", "ax_tree"]
applicability = "Elements in the accessibility tree with an explicit role whose implicit role does not depend on context (button, a[href], heading, table, ...)."
expectation = """
Reports (best practice) an explicit role that only repeats the element's implicit role
(<button role="button">). A role that changes the semantics (<a href role="button">) is not redundant.
role="list" on <ul>/<ol> is deliberately not reported (WebKit list-style workaround). Hidden subtrees
are out of scope."""
page_level = false
positive = ["aria_roles_invalid"]
negative = ["aria_roles_valid"]
not_applicable = ["aria_na_plain_article"]

[rule.variants]
visibility = { cases = ["aria_variant_hidden"] }
