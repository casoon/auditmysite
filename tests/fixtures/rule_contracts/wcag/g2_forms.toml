[[rule]]
id = "context/autofocus"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=context/autofocus)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 3.2.1 On Focus; HTML §6.6.7 autofocus"
capabilities = ["dom"]
applicability = "Rendered elements with the autofocus attribute."
expectation = """
Needs review when autofocus is set on something that is not a text-entry
field (a button): moving focus there on load can disorient, but on its own
it is no change of context, so never a confirmed violation. autofocus on an
input, select, textarea or a textbox/searchbox/combobox role is not
reported."""
positive = ["forms_context", "forms_embedded", "forms_dynamic_responsive"]
negative = ["forms_context", "forms_hidden"]
not_applicable = ["forms_static_text"]

[rule.variants]
visibility = { cases = ["forms_hidden"] }
native_vs_aria = { cases = ["forms_context"] }
alternative_labels = { not_relevant = "The rule judges the element type, not its name." }
frames_shadow_dom = { cases = ["forms_embedded"] }
responsive = { cases = ["forms_dynamic_responsive"] }
dynamic = { cases = ["forms_dynamic_responsive"] }
thresholds = { not_relevant = "Presence of autofocus on a non-entry element; no numeric boundary." }

