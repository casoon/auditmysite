[[rule]]
id = "color/link-indistinct"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=color/link-indistinct)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.4.1 Use of Color; failure F73; techniques G183, C15"
capabilities = ["dom", "computed_style"]
applicability = "Rendered links (a[href] or role=link) with text inside running text (a block with at least two other words), outside navigation and logos, displayed inline."
expectation = """
Fails when the link differs from the surrounding text only by colour: no
underline, same weight, style, font, bottom border and background (F73).
Underline, bold, a border or a background are non-colour cues and pass.
G183 passes as well: at least 3:1 contrast to the surrounding text plus a
non-colour cue on hover and focus; below 3:1 the hover cue does not help
(forms_link_color 2.61:1 fails, forms_gap_link_color 3.71:1 passes). Links in
lists, navigation, logos and block-level links are identified by their
position. role=link elements in running text are links too. Links inside a
same-origin frame are content of the page (forms_gap_frame_link_color). If
the host provides no computed style the rule reports itself untested."""
positive = ["forms_link_color", "link_in_text_block_context", "forms_embedded", "forms_dynamic_responsive", "forms_gap_link_color", "forms_gap_frame_link_color"]
negative = ["forms_link_color", "link_in_text_block_context", "forms_hidden", "forms_gap_link_color"]
not_applicable = ["forms_static_text"]

[rule.variants]
visibility = { cases = ["forms_hidden"] }
native_vs_aria = { cases = ["forms_gap_link_color"] }
alternative_labels = { cases = ["forms_link_color"] }
frames_shadow_dom = { cases = ["forms_embedded", "forms_gap_frame_link_color"] }
responsive = { cases = ["forms_dynamic_responsive"] }
dynamic = { cases = ["forms_dynamic_responsive"] }
thresholds = { cases = ["forms_link_color", "forms_gap_link_color"] }

