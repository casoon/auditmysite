# G2 rule contracts (#783): forms, links, buttons, authentication, context
# changes. Format: tests/fixtures/rule_contracts/README.md.
#
# Variant pages shared by most rules: forms_hidden (display:none, hidden,
# visibility:hidden, visually hidden but exposed), forms_embedded (open
# shadow root and same-origin iframe), forms_dynamic_responsive (inserted or
# fixed by script after load; shown only on narrow or only on wide
# viewports), forms_static_text (nothing the rules apply to). Cases named
# forms_gap_* hold spec cases the detectors currently miss or misjudge; they
# stay red until the entries in 783-shared-bugs.md are fixed.

# --- forms/* ----------------------------------------------------------------

[[rule]]
id = "forms/label-missing"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=forms/label-missing)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.3.1, 3.3.2, 4.1.2; HTML-AAM accessible name computation for input, select, textarea"
capabilities = ["dom"]
applicability = "Rendered input (except hidden, submit, button, reset, image), select and textarea elements."
expectation = """
Fails when the field has no programmatic label at all: no label[for], no
wrapping <label>, no aria-label, no aria-labelledby, no title, no placeholder.
A title or placeholder names the field (HTML-AAM), so such a field is not this
violation but a review under forms/title-only-label or
forms/placeholder-as-label. Fields that are not rendered (display:none,
hidden, visibility:hidden) are presented to nobody and are not judged; a
visually hidden field that stays in the accessibility tree is. Fields in open
shadow roots, same-origin frames, inserted after load or shown in one
viewport only are judged like any other. ARIA widgets (role=textbox) are not
this rule's elements; their missing name is names/required-missing."""
positive = ["forms_labels", "missing_label", "forms_hidden", "forms_embedded", "forms_dynamic_responsive"]
negative = ["forms_labels", "form_heuristics_clean", "forms_dynamic_responsive"]
not_applicable = ["forms_static_text"]

[rule.variants]
visibility = { cases = ["forms_hidden"] }
native_vs_aria = { cases = ["forms_labels"] }
alternative_labels = { cases = ["forms_labels"] }
frames_shadow_dom = { cases = ["forms_embedded"] }
responsive = { cases = ["forms_dynamic_responsive"] }
dynamic = { cases = ["forms_dynamic_responsive"] }
thresholds = { not_relevant = "Presence of a labelling mechanism; there is no numeric boundary." }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/dokument.toml"
change = "2 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id forms/label-missing)"

[[rule]]
id = "forms/placeholder-as-label"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=forms/placeholder-as-label)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 3.3.2 Labels or Instructions (Understanding: placeholder text disappears on input); HTML §4.10.5.3.11 placeholder"
capabilities = ["dom"]
applicability = "Rendered input, select and textarea elements with a non-empty placeholder."
expectation = """
Needs review when the placeholder is the only visible label: it names the
field, but it disappears as soon as the user types, so whether it suffices as
a label is a human judgement. A field with label[for] or a wrapping <label>
is not reported. aria-label is not visible, so a field whose only visible
label is the placeholder needs review even when it also has aria-label
(forms_gap_placeholder_aria). Never a confirmed violation."""
positive = ["forms_labels", "forms_embedded", "forms_dynamic_responsive", "forms_gap_placeholder_aria"]
negative = ["forms_labels", "forms_hidden"]
not_applicable = ["forms_static_text"]

[rule.variants]
visibility = { cases = ["forms_hidden"] }
native_vs_aria = { cases = ["forms_gap_placeholder_aria"] }
alternative_labels = { cases = ["forms_labels", "forms_gap_placeholder_aria"] }
frames_shadow_dom = { cases = ["forms_embedded"] }
responsive = { cases = ["forms_dynamic_responsive"] }
dynamic = { cases = ["forms_dynamic_responsive"] }
thresholds = { not_relevant = "Presence of a placeholder and of a visible label; no numeric boundary." }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/dokument.toml"
change = "1 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id forms/placeholder-as-label)"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/regressionen.toml"
