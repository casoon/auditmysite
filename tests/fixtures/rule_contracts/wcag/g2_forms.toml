[[rule]]
id = "forms/autocomplete-invalid"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=forms/autocomplete-invalid)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.3.5 Identify Input Purpose; HTML §4.10.18.7.1 autofill detail tokens"
capabilities = ["dom"]
applicability = "input (except type=hidden), select and textarea elements with an autocomplete attribute."
expectation = """
Fails when the autocomplete value does not follow the HTML autofill grammar
[section-*] [shipping|billing] [home|work|mobile|fax|pager] field-name
[webauthn], or is not on/off: an unknown field name ("company",
"delivery-note"), a contact token before a non-contact field ("work name"),
tokens in the wrong order ("postal-code shipping"). Case does not matter.
Valid combinations pass ("section-parcel shipping street-address", "work
email", "mobile tel", "Shipping Country-Name", "off"). type=hidden carries no
user input and is not judged."""
positive = ["forms_autofill", "forms_and_misc", "forms_embedded", "forms_dynamic_responsive"]
negative = ["forms_autofill", "forms_hidden"]
not_applicable = ["forms_static_text"]

[rule.variants]
visibility = { cases = ["forms_hidden"] }
native_vs_aria = { not_relevant = "autocomplete is an HTML attribute of input, select and textarea; ARIA widgets have no autofill token." }
alternative_labels = { cases = ["forms_autofill"] }
frames_shadow_dom = { cases = ["forms_embedded"] }
responsive = { cases = ["forms_dynamic_responsive"] }
dynamic = { cases = ["forms_dynamic_responsive"] }
thresholds = { not_relevant = "A grammar check on the token list; no numeric boundary." }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/formulare.toml"
change = "3 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id forms/autocomplete-invalid)"

[[rule]]
id = "forms/purpose-missing"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=forms/purpose-missing)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.3.5 Identify Input Purpose, section 7 Input Purposes for User Interface Components"
capabilities = ["dom", "ax_tree"]
applicability = "Rendered text, email, tel, url and password inputs outside role=search and role=combobox."
expectation = """
Needs review when a field seems to collect information about the user (type
email or tel; a label, id or name naming e-mail, phone, address, postal
code, birth date, password, or the person's name) and has no autocomplete
token (missing, empty, on or off). Whether the field really concerns the
user is a guess, so never a confirmed violation. The name of a thing
("Project name", "Name" of a saved view, "Dateiname"), technical addresses
("IP address"), "tel" inside "Hotel" and search boxes are not reported. A
field with a valid token is not reported."""
positive = ["forms_autofill", "input_purpose_name", "form_heuristics_flagged", "forms_submit_redundant", "forms_embedded", "forms_dynamic_responsive"]
negative = ["forms_autofill", "input_purpose_name", "forms_hidden"]
not_applicable = ["forms_static_text"]

[rule.variants]
visibility = { cases = ["forms_hidden"] }
native_vs_aria = { not_relevant = "The input purpose is programmatically determined only through the HTML autofill tokens of native fields; ARIA widgets cannot carry one." }
alternative_labels = { cases = ["forms_autofill", "input_purpose_name"] }
frames_shadow_dom = { cases = ["forms_embedded"] }
responsive = { cases = ["forms_dynamic_responsive"] }
dynamic = { cases = ["forms_dynamic_responsive"] }
thresholds = { not_relevant = "Word recognition in the label, id and name; no numeric boundary." }

