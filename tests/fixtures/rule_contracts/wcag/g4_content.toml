[[rule]]
id = "frame-tested"
automation = "manual"
manual_reason = """
The rule only flags embedded content from another origin for a human: whether
that content meets WCAG is outside the page's own markup and is never
concluded automatically."""
method = "page"
source = "WCAG 2.2 SC 4.1.2 (and every SC for embedded content); axe-core frame-tested; HTML §7.1 origin"
capabilities = ["dom", "geometry", "frames"]
applicability = """
Every perceivable <iframe>/<frame> (not hidden, aria-hidden, role none/presentation, display:none, visibility:hidden, or 1px or smaller) in the document, its shadow roots included."""
expectation = """
One UNTESTED note per perceivable frame whose document is cross-origin to the
page, located at the frame. Same-origin and srcdoc frames, and frames that are
not perceivable (hidden, aria-hidden, display:none, at most 1px in either
dimension), get no note. A frame inserted by script or inside a shadow root is
part of the page and is judged the same way. Never a pass or a violation."""
positive = ["content_frames_cross_origin"]
not_applicable = ["content_frames_same_origin", "content_plain_article"]

[rule.variants]
visibility = { cases = ["content_frames_cross_origin"] }
native_vs_aria = { not_relevant = "role none/presentation removes the frame from the note like aria-hidden; content_frames_cross_origin covers aria-hidden." }
alternative_labels = { not_relevant = "Frame titles are frames/name-missing; a title does not make embedded content reviewed." }
frames_shadow_dom = { cases = ["content_frames_cross_origin", "content_frames_same_origin"] }
responsive = { not_relevant = "Origin does not depend on the viewport; size is covered by the threshold case." }
dynamic = { cases = ["content_frames_cross_origin"] }
thresholds = { cases = ["content_frames_cross_origin"] }

[rule.test_strength]
status = "killed"
[[rule.test_strength.mutations]]
target = "src/wcag/rules/media_rules.rs"
change = "flag same-origin frames too"
find = "if (!crossOrigin) continue;"
replace = ""
killed_by = "corpus:content_frames_same_origin"
