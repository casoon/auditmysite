[[rule]]
id = "media-alt"
automation = "manual"
manual_reason = """
Whether prerecorded media has a full text alternative or audio description is
a judgement about the content of the media; the DOM can only show that media
(or a transcript link) exists. The note stands on every page because custom
players are not reliably detectable."""
method = "page"
source = "WCAG 2.2 SC 1.2.8 Media Alternative (Prerecorded) (AAA), G69, G159"
capabilities = ["dom"]
applicability = """
Every page (page-wide manual note, enriched when <video> / iframe embeds and a transcript link are found)."""
expectation = """
Always one UNTESTED note: on pages with video it names the video and, when a
nearby link mentions a transcript, quotes it as evidence (presence, not
completeness); without detected media it is the general 1.2.8 reminder. Never a
pass, never a violation."""
page_level = true
ambient = true
positive = ["media_and_motion", "content_plain_article"]
not_applicable = []

[rule.variants]
visibility = { not_relevant = "The note is page-wide; it does not depend on any element's visibility." }
native_vs_aria = { not_relevant = "Detection reads <video> and iframe[src]; ARIA plays no part." }
alternative_labels = { not_relevant = "A transcript link only enriches the message; it never turns the note into a pass." }
frames_shadow_dom = { not_relevant = "Page-wide note on the top document; frames and shadow roots do not change it." }
responsive = { not_relevant = "Page-wide note; the viewport does not change it." }
dynamic = { not_relevant = "Page-wide note; content inserted after load only changes the message." }
thresholds = { not_relevant = "No threshold: the note is unconditional." }

[rule.test_strength]
status = "killed"
[[rule.test_strength.mutations]]
target = "src/wcag/rules/media_alternative.rs"
change = "drop the page-wide note on pages without detected media"
find = """
    if !has_video && !has_embed {
        // No video found"""
replace = """
    if !has_video && !has_embed {
        return Vec::new();
        // No video found"""
killed_by = "corpus:content_plain_article"
[[rule.test_strength.mutations]]
target = "src/wcag/rules/media_alternative.rs"
change = "turn the video note into a positive signal"
find = """
    .with_kind(Outcome::Untested)]
}"""
replace = """
    .as_positive()]
}"""
killed_by = "corpus:media_and_motion"

[[rule]]
id = "video-caption"
errored = ["error_page_scripts_sabotaged"]
automation = "automated"
method = "page"
source = "WCAG 2.2 SC 1.2.2 Captions (Prerecorded) (H95, G87, F8); HTML §4.8.11.11 track"
capabilities = ["dom", "network"]
applicability = """
Pages with a rendered native <video> or a known video-platform embed iframe."""
expectation = """
Pass (positive signal, no finding) only when every rendered <video> has a
<track kind="captions"|"subtitles"> whose src resolves same-origin as a caption
file (.vtt/.srt or a vtt content type). Anything less — no caption track, a
track that does not resolve or is cross-origin, only description/chapter
tracks, more caption tracks than the probe budget of 10 checks, or third-party
embeds — is one page-level UNTESTED note: captions may exist in ways the tool
cannot see (open captions, platform players), so never a violation. A page
without rendered video is not applicable; a video in a hidden panel is not
presented in this state."""
page_level = true
positive = ["content_video_uncaptioned", "content_video_partly_captioned", "content_video_dynamic", "content_video_eleven_tracks", "media_and_motion"]
negative = ["content_video_captioned", "content_video_ten_tracks"]
not_applicable = ["content_plain_article", "content_video_hidden"]

[rule.variants]
visibility = { cases = ["content_video_hidden"] }
native_vs_aria = { not_relevant = "Applies to native <video> and platform embeds; ARIA has no caption mechanism." }
alternative_labels = { cases = ["content_video_captioned", "content_video_uncaptioned"] }
frames_shadow_dom = { not_relevant = "Videos inside frames are the frame's content; the rule reads the top document. Third-party embeds are recognised by host and need network access, not exercised offline." }
responsive = { not_relevant = "Caption tracks do not depend on the viewport." }
dynamic = { cases = ["content_video_dynamic"] }
thresholds = { cases = ["content_video_ten_tracks", "content_video_eleven_tracks"] }

