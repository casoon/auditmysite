# Rule contracts, package G4 (#783): lists, tables, images, objects, media,
# data visualisations. Format: tests/fixtures/rule_contracts/README.md.
# Shared rules (method = "shared") run from a11y-rules through
# src/wcag/shared.rs; their mutation catalog and direct tests live in
# barrierlab. Local rules: image-alt (tree), media-alt, video-caption and
# frame-tested (page rules).

[[rule]]
id = "lists/invalid-structure"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=lists/invalid-structure)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.3.1 Info and Relationships (F2, H48); HTML §4.4.5-4.4.10 list content models; WAI-ARIA 1.2 list/listitem/term/definition"
capabilities = ["dom", "computed_style"]
applicability = """
Every rendered, not aria-hidden list: <ul>/<ol> without a foreign role, or an element with role="list"."""
expectation = """
A list whose direct children (seen through <slot> into assigned content) include
anything other than list items (<li> or role="listitem" without another role),
<script> or <template> fails: the list announces items, and the stray child is
read outside the item structure (H48, HTML list content model). Fires once per
list, located at the list. A list with another explicit role (none,
presentation, menu, listbox) is not a list. Lists not rendered or under
aria-hidden="true" are not in the accessibility tree and are not judged."""
positive = ["content_lists_broken"]
negative = ["content_lists_ok", "content_lists_responsive_role"]
not_applicable = ["content_plain_article", "content_lists_trailing_term"]

[rule.variants]
visibility = { cases = ["content_lists_broken"] }
native_vs_aria = { cases = ["content_lists_broken", "content_lists_ok"] }
alternative_labels = { not_relevant = "Structure check; names and labels play no part in it." }
frames_shadow_dom = { cases = ["content_lists_broken", "content_lists_ok"] }
responsive = { not_relevant = "Markup-only check; a viewport changes nothing it reads except visibility, which the visibility cases cover." }
dynamic = { cases = ["content_lists_broken"] }
thresholds = { not_relevant = "One stray child suffices; there is no count or size threshold." }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/struktur.toml"
change = "1 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id lists/invalid-structure)"

