[[rule]]
id = "lists/term-without-definition"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=lists/term-without-definition)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.3.1 Info and Relationships (F2, H48); HTML §4.4.5-4.4.10 list content models; WAI-ARIA 1.2 list/listitem/term/definition"
capabilities = ["dom", "computed_style"]
applicability = """
Every rendered, not aria-hidden term: <dt> or role="term"."""
expectation = """
HTML's <dl> content model is groups of one or more <dt> followed by one or more
<dd> (or <div> groups of the same). A term with no definition following it in
its group fails 1.3.1: the reader hears a term and nothing that defines it.
Several terms sharing one definition pass. A <dt> after the last <dd> (a
trailing term) has no definition and fails even though its <dl> holds other
definitions. role="term" without any role="definition" sibling fails the same
way. Located at the term."""
positive = ["content_lists_broken", "content_lists_trailing_term"]
negative = ["content_lists_ok"]
not_applicable = ["content_plain_article", "content_lists_responsive_role"]

[rule.variants]
visibility = { not_relevant = "Every term in the cases is rendered; hiding goes through the same visibility layer as lists/invalid-structure, whose hidden cases cover it." }
native_vs_aria = { cases = ["content_lists_broken", "content_lists_ok"] }
alternative_labels = { not_relevant = "Structure check; names and labels play no part in it." }
frames_shadow_dom = { not_relevant = "The same element walk as lists/invalid-structure, whose shadow and frame cases cover it; no definition list in a frame is needed to show anything new." }
responsive = { not_relevant = "The rule reads markup; a viewport only changes whether content is rendered, which goes through the same visibility layer the visibility cases and the responsive image case exercise." }
dynamic = { not_relevant = "Reads the DOM at audit time like every list rule; the dynamic list cases cover that path." }
thresholds = { not_relevant = "Group boundary: terms sharing a following definition pass (content_lists_ok), a trailing term fails (content_lists_trailing_term)." }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/struktur.toml"
change = "2 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id lists/term-without-definition)"

[[rule]]
id = "lists/role-redundant"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=lists/role-redundant)"]
automation = "automated"
method = "shared"
source = "WAI-ARIA 1.2 §5.1 (do not repeat implicit roles), ARIA in HTML §4 (redundant roles); auditmysite#644 (WebKit drops list semantics for list-style: none)"
capabilities = ["dom", "computed_style"]
applicability = """
Every rendered <ul>/<ol> with role="list"."""
expectation = """
role="list" on <ul>/<ol> repeats the implicit role and is redundant (best
practice) only while the list keeps visible markers. With list-style-type: none
the role restores semantics WebKit/VoiceOver drop, so it is needed and passes.
A role needed in one viewport is not redundant: a list whose markers are
removed only at a mobile or only at a desktop width passes. Without a computed
list-style-type the rule cannot decide and reports UNTESTED for the page."""
positive = ["redundant_role_list_style"]
negative = ["redundant_role_list_style", "content_lists_ok", "content_lists_responsive_role"]
not_applicable = ["content_plain_article", "content_lists_broken"]

[rule.variants]
visibility = { not_relevant = "Applies to rendered lists only through the shared visibility layer; the decisive property is list-style-type, not visibility." }
native_vs_aria = { not_relevant = "Only <ul>/<ol> carrying role=\"list\" is in scope; an ARIA-only list has no implicit role to repeat." }
alternative_labels = { not_relevant = "Structure check; names and labels play no part in it." }
frames_shadow_dom = { not_relevant = "Frame documents carry no computed styles for this rule (FRAME_SHARED_RULES leaves it out); shadow lists read the same computed style." }
responsive = { cases = ["content_lists_responsive_role"] }
dynamic = { not_relevant = "Reads computed style at audit time; no state change is involved." }
thresholds = { not_relevant = "Boundary is list-style-type none vs anything else: redundant_role_list_style has both sides." }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/darstellung.toml"
change = "2 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id lists/role-redundant)"

