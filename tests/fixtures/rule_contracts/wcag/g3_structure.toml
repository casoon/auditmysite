negative = ["structure_outline_clean", "structure_modal_dynamic", "structure_title_untitled"]
not_applicable = ["structure_bypass_missing", "structure_aria_landmarks_svg_title"]

[rule.variants]
visibility = { not_relevant = "The title element is never rendered." }
native_vs_aria = { not_relevant = "ARIA cannot title a document." }
alternative_labels = { cases = ["structure_aria_landmarks_svg_title"] }
frames_shadow_dom = { not_relevant = "Only the top-level document's own title element counts; that an embedded document's title does not stand in is pinned by document/title-missing (structure_bypass_missing)." }
responsive = { not_relevant = "The title does not depend on the viewport." }
dynamic = { cases = ["structure_modal_dynamic"] }
thresholds = { cases = ["structure_head_defects", "empty_title"] }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/dokument.toml"
change = "1 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id document/title-empty)"

[[rule]]
id = "document-title"
errored = ["error_page_scripts_sabotaged"]
automation = "automated"
method = "page"
source = "WCAG 2.2 SC 2.4.2 Page Titled; failure F25 (title that does not identify the contents); G88"
capabilities = ["dom"]
applicability = "Top-level HTML documents whose title element has non-empty text."
expectation = """
Fails when the whole title, trimmed and compared case-insensitively, is an
authoring-tool or placeholder default that identifies no content (F25:
"Untitled Document", "New Page", "Untitled"). A descriptive title that merely
contains such a word ("Index of tool specifications – ...") passes. A missing
or empty title is not applicable (document/title-missing, document/title-empty).
Only the top-level document's title counts; a default title inside an embedded
frame document does not make the host page fail. A title written by script
before the audit counts. One finding at the head element."""
page_level = false
ambient = false
positive = ["structure_title_untitled"]
negative = ["structure_outline_clean", "structure_ids_frames", "structure_modal_dynamic", "structure_content_model"]
not_applicable = ["empty_title", "structure_head_defects", "structure_bypass_missing", "structure_aria_landmarks_svg_title"]

[rule.variants]
visibility = { not_relevant = "The title element is never rendered." }
native_vs_aria = { not_relevant = "ARIA cannot title a document." }
alternative_labels = { cases = ["structure_aria_landmarks_svg_title"] }
frames_shadow_dom = { cases = ["structure_ids_frames"] }
responsive = { not_relevant = "The title does not depend on the viewport." }
dynamic = { cases = ["structure_modal_dynamic"] }
thresholds = { cases = ["structure_title_untitled", "structure_content_model"] }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "src/wcag/rules/page_titled.rs"
change = "invert the generic-title decision"
find = "if title.is_empty() || !is_generic_title(title) {"
replace = "if title.is_empty() || is_generic_title(title) {"
killed_by = "corpus:structure_title_untitled,structure_outline_clean"

[[rule.test_strength.mutations]]
target = "src/wcag/rules/page_titled.rs"
change = "drop the case folding before the comparison"
find = "let title_lower = title.to_lowercase();"
replace = "let title_lower = title.to_string();"
killed_by = "corpus:structure_title_untitled"

[[rule.test_strength.mutations]]
target = "src/wcag/rules/page_titled.rs"
change = "drop the whitespace trim before the comparison"
find = "let title = title.trim();"
replace = "let title = title;"
killed_by = "corpus:structure_title_untitled"

# --- headings ------------------------------------------------------------------

[[rule]]
id = "headings/empty"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=headings/empty)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.3.1 Info and Relationships, SC 2.4.6 Headings and Labels; ACT ffd0e9 (Heading has non-empty accessible name)"
capabilities = ["dom", "computed_style"]
applicability = "Rendered elements with the heading role: h1-h6 and elements with role=heading, also inside open shadow roots."
expectation = """
Fails for every rendered heading whose accessible name is empty: no text, and
no name from aria-label, aria-labelledby or an image's non-empty alt. A heading
whose only content is a decorative image (alt="") is empty. role="heading"
elements are headings like h1-h6 (ACT ffd0e9 applies to the semantic role).
Headings hidden with display:none are not presented and do not apply. One
finding per empty heading, at the heading."""
page_level = false
ambient = false
positive = ["structure_head_defects", "structure_ids_frames"]
negative = ["structure_outline_clean", "structure_aria_landmarks_svg_title"]
not_applicable = ["structure_bypass_missing", "structure_bypass_review"]

[rule.variants]
visibility = { cases = ["structure_head_defects"] }
native_vs_aria = { cases = ["structure_head_defects"] }
alternative_labels = { cases = ["structure_head_defects"] }
frames_shadow_dom = { cases = ["structure_ids_frames"] }
responsive = { not_relevant = "Whether a heading is rendered is the same rendered-view decision in every viewport; the breakpoint switch itself is pinned by the outline rules (structure_responsive_chrome)." }
dynamic = { cases = ["structure_ids_frames"] }
thresholds = { not_relevant = "A name is present or not; no threshold." }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/dokument.toml"
change = "2 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id headings/empty)"

[[rule]]
id = "headings/skip-level"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=headings/skip-level)"]
automation = "automated"
method = "shared"
source = "Best practice, no WCAG failure: G141 and H42 (advisory) for SC 1.3.1/2.4.10; axe heading-order"
capabilities = ["dom", "computed_style"]
applicability = "Rendered headings in document order, from the second heading on."
expectation = """
Flags a heading whose level is more than one deeper than the previous rendered
heading (h2 followed by h4), at that heading. Going back up any number of
levels (h3 to h1) or one level down is fine; the first heading may have any
level. Hidden headings (display:none) are not part of the outline, so a hidden
h5 between two h3 is no skip. Skipping levels is not a WCAG failure (G141 is
advisory), so the finding is a best-practice violation without a success
criterion."""
page_level = false
ambient = false
positive = ["heading_order", "structure_heading_outline"]
negative = ["structure_outline_clean", "structure_head_defects", "structure_aria_landmarks_svg_title", "structure_content_model"]
not_applicable = ["structure_bypass_missing", "structure_bypass_review"]

[rule.variants]
visibility = { cases = ["structure_heading_outline"] }
native_vs_aria = { cases = ["structure_aria_landmarks_svg_title"] }
alternative_labels = { not_relevant = "The rule compares heading levels, not names." }
frames_shadow_dom = { not_relevant = "One outline per document; a frame document has its own outline and is not part of the host's sequence." }
responsive = { cases = ["structure_responsive_chrome"] }
dynamic = { not_relevant = "The outline is read from the captured DOM after load; script-built headings are the same input as markup (shadow-root headings built by script: headings/empty, structure_ids_frames)." }
thresholds = { cases = ["structure_heading_outline", "structure_content_model"] }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/dokument.toml"
change = "2 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id headings/skip-level)"

[[rule]]
id = "headings/h1-missing"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=headings/h1-missing)"]
automation = "automated"
method = "shared"
source = "Best practice, no WCAG failure: axe page-has-heading-one; WAI tutorial Page Structure: Headings"
capabilities = ["dom", "computed_style"]
applicability = "Documents with at least one rendered heading."
expectation = """
Flags a document that has rendered headings but no rendered level-1 heading:
neither an h1 nor role="heading" aria-level="1". A hidden h1 (hidden attribute)
does not count. A level-1 heading inside an open shadow root counts. In each
viewport the rendered h1 may be a different element. Not a WCAG failure (no
criterion requires a level); a best-practice violation for the whole document,
without an element."""
page_level = true
ambient = false
positive = ["structure_content_model"]
negative = ["structure_outline_clean", "structure_head_defects", "structure_aria_landmarks_svg_title", "structure_responsive_chrome", "landmark_main_in_shadow_root"]
not_applicable = ["structure_bypass_missing", "structure_bypass_review"]

[rule.variants]
visibility = { cases = ["structure_content_model"] }
native_vs_aria = { cases = ["structure_aria_landmarks_svg_title"] }
alternative_labels = { not_relevant = "The rule looks at heading levels, not names." }
frames_shadow_dom = { cases = ["landmark_main_in_shadow_root"] }
responsive = { cases = ["structure_responsive_chrome"] }
dynamic = { cases = ["landmark_main_in_shadow_root"] }
thresholds = { not_relevant = "Presence of a level-1 heading; no threshold." }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/dokument.toml"
change = "2 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id headings/h1-missing)"

