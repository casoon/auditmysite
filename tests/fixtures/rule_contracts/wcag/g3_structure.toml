[[rule]]
id = "headings/section-without-heading"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=headings/section-without-heading)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 2.4.10 Section Headings (AAA, review); G141; HTML §4.3 sections"
capabilities = ["dom", "computed_style"]
applicability = "article elements and named section elements (regions)."
expectation = """
Asks for review once per page when articles or named sections contain no
heading: whether a section needs a heading depends on its content (teaser
