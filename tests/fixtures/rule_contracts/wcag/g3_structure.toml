frames_shadow_dom = { cases = ["landmark_main_in_shadow_root"] }
responsive = { not_relevant = "Headings and landmarks hidden per breakpoint are the rendered-view decision pinned by structure_responsive_chrome for the landmark rules; that page always has headings." }
dynamic = { cases = ["structure_modal_dynamic"] }
thresholds = { cases = ["structure_bypass_missing", "structure_bypass_review"] }

