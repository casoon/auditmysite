# Rule contracts G3 (#783): document, headings, landmarks, language, frames,
# ids. Format: tests/fixtures/rule_contracts/README.md.
#
# Shared rules (method = "shared") run from a11y-rules through
# src/wcag/shared.rs over the captured DOM in its rendered view (CSS-hidden
# content is not part of it). Their `errored`, `shared_tests` and mutation
# lists are filled by the coordinator.

# --- document -----------------------------------------------------------------

[[rule]]
id = "document/lang-missing"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=document/lang-missing)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 3.1.1 Language of Page; ACT b5c3f8 (HTML page has lang attribute); H57; HTML §3.2.6.2 the lang attribute"
capabilities = ["dom"]
applicability = "The root html element of the top-level document; every HTML page."
expectation = """
Fails when the root html element has no lang attribute, or one whose value is
empty or only whitespace: ACT b5c3f8 requires a lang attribute with a
non-empty value, and lang="" explicitly declares the language unknown (HTML
§3.2.6.2), so the page language is not programmatically determinable. xml:lang
alone has no effect in text/html. A non-empty value, valid or not, passes this
id; its validity is document/lang-invalid. A lang set by script before the
audit reads the DOM counts like markup. Embedded documents are html-has-lang.
One finding at the html element."""
page_level = false
always_applicable = true
ambient = false
positive = ["missing_lang", "structure_bypass_review"]
negative = ["structure_outline_clean", "structure_head_defects", "structure_bypass_missing", "structure_modal_dynamic"]
not_applicable = []

[rule.variants]
visibility = { not_relevant = "The lang attribute of the root element is not rendered content; nothing about it can be hidden." }
native_vs_aria = { not_relevant = "ARIA has no way to declare a language; lang is the only mechanism." }
alternative_labels = { not_relevant = "HTML has one page-language declaration, lang on the root; xml:lang has no effect in text/html (HTML §3.2.6.2), and Content-Language headers are not a programmatic determination for AT." }
frames_shadow_dom = { not_relevant = "Applies to the top-level document's root only; embedded documents are checked by html-has-lang, and a shadow root has no root html element." }
responsive = { not_relevant = "The root element's attributes do not depend on the viewport." }
dynamic = { cases = ["structure_modal_dynamic"] }
thresholds = { cases = ["structure_bypass_review", "missing_lang"] }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/dokument.toml"
change = "1 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id document/lang-missing)"

[[rule]]
id = "document/lang-invalid"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=document/lang-invalid)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 3.1.1 Language of Page; ACT bf051a (HTML page lang attribute has valid language tag); BCP 47 (RFC 5646) §2.1"
capabilities = ["dom"]
applicability = "The root html element of the top-level document when its lang attribute has a non-empty value."
expectation = """
Fails when the primary language subtag of the root's lang value is not a valid
BCP 47 language subtag: "english" (not a registered subtag), "en_US" (the
underscore is no subtag separator, so the whole value is the primary subtag).
Region and script subtags ("en-GB", "de-AT") are valid. An absent or empty lang
is not applicable here (ACT bf051a applies to non-empty values only); that case
is document/lang-missing. One finding at the html element."""
page_level = false
ambient = false
positive = ["invalid_lang_code", "structure_bypass_missing"]
negative = ["structure_outline_clean", "structure_aria_landmarks_svg_title", "structure_modal_dynamic"]
not_applicable = ["missing_lang", "structure_bypass_review"]

[rule.variants]
visibility = { not_relevant = "The lang attribute of the root element is not rendered content." }
native_vs_aria = { not_relevant = "ARIA has no way to declare a language." }
alternative_labels = { not_relevant = "Only the lang attribute declares the page language in text/html." }
frames_shadow_dom = { not_relevant = "Applies to the top-level document's root only." }
responsive = { not_relevant = "The root element's attributes do not depend on the viewport." }
dynamic = { cases = ["structure_modal_dynamic"] }
thresholds = { cases = ["invalid_lang_code", "structure_bypass_missing", "structure_aria_landmarks_svg_title", "structure_bypass_review"] }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/dokument.toml"
change = "2 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id document/lang-invalid)"

[[rule]]
id = "document/lang-mismatch"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=document/lang-mismatch)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 3.1.1 Language of Page; ACT 5b7ae0 (HTML page lang and xml:lang attributes have matching values); HTML §3.2.6.2"
capabilities = ["dom"]
applicability = "The root html element of the top-level document when it has both a non-empty lang and a non-empty xml:lang."
expectation = """
Fails when the primary language subtags of lang and xml:lang differ
(lang="en" xml:lang="de"): which language applies then depends on the user
agent. Matching primary subtags with different regions (en-GB / en-US, en /
en-GB) pass, as ACT 5b7ae0 compares primary subtags. Without xml:lang the rule
does not apply. One finding at the html element."""
page_level = false
ambient = false
positive = ["structure_head_defects"]
negative = ["structure_outline_clean", "structure_aria_landmarks_svg_title"]
not_applicable = ["missing_lang", "structure_bypass_review"]

[rule.variants]
visibility = { not_relevant = "Attributes of the root element are not rendered content." }
native_vs_aria = { not_relevant = "ARIA has no way to declare a language." }
alternative_labels = { not_relevant = "The rule compares exactly the two declarations lang and xml:lang." }
frames_shadow_dom = { not_relevant = "Applies to the top-level document's root only." }
responsive = { not_relevant = "The root element's attributes do not depend on the viewport." }
dynamic = { not_relevant = "Both attributes are read from the captured DOM like markup; a root lang set by script is covered by document/lang-missing (structure_modal_dynamic)." }
thresholds = { cases = ["structure_head_defects", "structure_outline_clean", "structure_aria_landmarks_svg_title"] }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/dokument.toml"
change = "1 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id document/lang-mismatch)"

[[rule]]
id = "document/title-missing"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=document/title-missing)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 2.4.2 Page Titled; ACT 2779a5 (HTML page has non-empty title); HTML §4.2.2 the title element; SVG 2 §5.9 the title element"
capabilities = ["dom"]
applicability = "Every top-level HTML document."
expectation = """
Fails when the document has no HTML title element. An SVG <title> inside the
body titles its graphic, not the document (SVG 2 §5.9, HTML §4.2.2 counts only
the title element in the HTML namespace), so a page whose only title element
is an SVG title has no title. The title of an embedded document does not title
the host page. A title written by script before the audit reads the DOM counts.
A present but empty title is document/title-empty. The finding concerns the
whole document and carries no element."""
page_level = true
always_applicable = true
ambient = false
positive = ["structure_bypass_missing", "structure_aria_landmarks_svg_title"]
negative = ["structure_outline_clean", "structure_title_untitled", "structure_modal_dynamic"]
not_applicable = []

[rule.variants]
visibility = { not_relevant = "The title element is never rendered; it is metadata." }
native_vs_aria = { not_relevant = "ARIA cannot title a document; aria-label on html is not a page title." }
alternative_labels = { cases = ["structure_aria_landmarks_svg_title"] }
frames_shadow_dom = { cases = ["structure_bypass_missing"] }
responsive = { not_relevant = "The title does not depend on the viewport." }
dynamic = { cases = ["structure_modal_dynamic"] }
thresholds = { not_relevant = "Presence check; emptiness is document/title-empty." }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/dokument.toml"
change = "2 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id document/title-missing)"

[[rule]]
id = "document/title-empty"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=document/title-empty)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 2.4.2 Page Titled; ACT 2779a5 (HTML page has non-empty title); HTML §4.2.2"
capabilities = ["dom"]
applicability = "Top-level HTML documents that have a title element."
expectation = """
Fails when the document's title element is empty or contains only whitespace.
A title set by script (document.title) before the audit reads the DOM is not
