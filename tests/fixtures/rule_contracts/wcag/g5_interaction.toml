[[rule]]
id = "keyboard-trap"
automation = "manual"
manual_reason = "Whether focus can leave a component shows only by operating it with the keyboard (Tab, Shift+Tab, Escape); the accessibility tree cannot tell a trap from a well-behaved modal."
method = "tree"
source = "WCAG 2.2 SC 2.1.2 No Keyboard Trap; WAI-ARIA 1.2 aria-modal, HTML §4.11.4 dialog showModal()"
capabilities = ["ax_tree"]
applicability = "Pages where keyboard focus can be moved to a component: at least one focusable node other than the document root."
expectation = """
On every page with a focusable component: one page-wide UNTESTED note
(needs_review). In addition one needs_review per modal dialog in the
accessibility tree (role dialog/alertdialog with modal=true: aria-modal="true"
or a native dialog opened with showModal()), because a modal deliberately
keeps focus and must let it go again. A non-modal dialog (no aria-modal, or
dialog.show()) adds nothing. A page without any focusable component is not
applicable: no note. Never pass or violation."""
page_level = true
ambient = true
positive = ["interaction_dialog_aria", "interaction_dialog_native", "interaction_click_pointer"]
not_applicable = ["interaction_static_text", "interaction_no_text", "no_focus_targets"]

[rule.variants]
visibility = { not_relevant = "Read from the accessibility tree, where hidden dialogs are ignored nodes; a closed dialog is no modal." }
