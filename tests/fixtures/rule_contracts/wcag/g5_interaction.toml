automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 2.4.7 Focus Visible; failure F78 (styling that removes or renders the focus indicator non-visible)"
capabilities = ["stylesheets"]
applicability = "Pages whose stylesheets contain a :focus rule that removes the outline (outline: none / 0, outline-style: none, outline-width: 0)."
expectation = """
violation once per page (page-level) when a stylesheet removes the focus
outline under :focus and no rule replaces it: no :focus-visible rule anywhere
and no :focus rule that sets another indicator (box-shadow, border,
background, text decoration, or the outline itself). Rules inside a media
query that applies on the phone viewport count, as do stylesheets a script
injects after load. A replacement in the same rule, or a :focus-visible rule
for keyboard focus, passes. Pages without such a rule are not applicable."""
page_level = true
positive = ["interaction_outline_removed", "interaction_outline_removed_mobile", "interaction_outline_removed_dynamic"]
