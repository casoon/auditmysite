[[rule]]
id = "keyboard/scrollable-region-not-focusable"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=keyboard/scrollable-region-not-focusable)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 2.1.1 Keyboard; axe-core scrollable-region-focusable (13 px tolerance)"
capabilities = ["dom", "geometry", "computed_style"]
applicability = "Rendered elements other than html/body whose content overflows their box and that contain text."
expectation = """
violation once per scroll region whose content extends more than 13 px
beyond its box (scroll overflow), with text to reveal, when neither the
region (tabindex >= 0) nor any non-inert element inside can take keyboard
focus: the hidden part stays unreachable from the keyboard. Overflow of 13 px
or less is sub-pixel or padding noise and passes; overflow: hidden is no
scroll region; a region without text, an inert region and a region that is
not rendered are not reported. Overflow on one viewport only (text wrapping
on the phone) counts, as does content a script adds after load."""
positive = ["interaction_scroll_regions", "scrollable_region_focusable"]
negative = ["interaction_scroll_regions"]
not_applicable = ["interaction_static_text"]

[rule.variants]
visibility = { cases = ["interaction_scroll_regions"] }
native_vs_aria = { cases = ["interaction_scroll_regions"] }
alternative_labels = { not_relevant = "Naming the region does not make it reachable; only focusability counts." }
frames_shadow_dom = { not_relevant = "An iframe scrolls as its own document, which the keyboard reaches through the frame; the rule judges element scroll regions of one document." }
responsive = { cases = ["interaction_scroll_regions"] }
dynamic = { cases = ["interaction_scroll_regions"] }
thresholds = { cases = ["interaction_scroll_regions"] }

