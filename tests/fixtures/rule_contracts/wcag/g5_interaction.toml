[[rule]]
id = "keyboard/skip-link-missing"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=keyboard/skip-link-missing)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 2.4.1 Bypass Blocks; techniques G1 (skip link at the top), ARIA11/H69 (landmarks, headings)"
capabilities = ["dom"]
applicability = "Pages with blocks a keyboard user has to pass to reach the main content: links or other tab stops in front of it. A page without any link or focusable element has nothing to bypass."
expectation = """
needs_review once per page (page-level, at the root) when header or
navigation links precede the main content and no link bypasses them: no
fragment link to the start of the main content, no run of in-page links in
front of the first link that leaves the page. A skip link counts in any
language, also when it is visually hidden until focused, and also when a
script inserts it after load. Review, not violation: 2.4.1 can also be met by
landmarks and headings. A page without any link or focusable element is not
applicable (nothing to tab past)."""
page_level = true
positive = ["interaction_skip_link_missing"]
negative = ["interaction_tab_order", "interaction_location_breadcrumb", "skip_link_language"]
not_applicable = ["interaction_static_text", "interaction_no_text", "no_focus_targets"]

[rule.variants]
visibility = { cases = ["interaction_tab_order"] }
native_vs_aria = { not_relevant = "A skip link is an ordinary <a href=\"#...\">; there is no ARIA form of it." }
alternative_labels = { cases = ["skip_link_language"] }
frames_shadow_dom = { not_relevant = "2.4.1 is judged per document; an iframe is a document of its own." }
responsive = { not_relevant = "Links and their order do not change with the viewport in the markup the rule reads." }
dynamic = { cases = ["interaction_location_breadcrumb"] }
thresholds = { not_relevant = "Presence check; no numeric threshold." }

