replace = "const ENTIRELY_HIDDEN_RATIO: f64 = 0.05;"
killed_by = "lib:wcag::rules::focus_not_obscured_minimum"

[[rule]]
id = "focus-not-obscured-enhanced"
errored = ["error_page_scripts_sabotaged"]
automation = "automated"
method = "page"
source = "WCAG 2.2 SC 2.4.12 Focus Not Obscured (Enhanced) (AAA)"
capabilities = ["dom", "geometry", "computed_style"]
applicability = "Pages with rendered keyboard-focusable controls and at least one visible fixed or sticky element at least 20 x 20 px."
expectation = """
needs_review once per control of which a fixed or sticky element painted
above it covers any meaningful part (at least 5 % of its area; a 1 px edge
contact is rounding, not covering). An entirely covered control is reported
here as well as under 2.4.11. Not reported: an overlay that is
visibility: hidden, an overlay painted below the control (z-index), a
control inside the overlay. An overlay fixed only on the phone viewport, or
added by script after load, counts."""
positive = ["interaction_focus_obscured", "media_and_visual"]
negative = ["interaction_focus_obscured"]
not_applicable = ["interaction_static_text", "interaction_click_pointer"]

[rule.variants]
visibility = { cases = ["interaction_focus_obscured"] }
native_vs_aria = { not_relevant = "Every keyboard-focusable control, native or with tabindex, is taken alike; coverage is geometry and paint order." }
alternative_labels = { not_relevant = "Naming plays no part in being covered." }
frames_shadow_dom = { not_relevant = "Fixed content inside an iframe is positioned within that frame's document, which is audited on its own." }
responsive = { cases = ["interaction_focus_obscured"] }
dynamic = { cases = ["interaction_focus_obscured"] }
thresholds = { cases = ["interaction_focus_obscured"] }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "src/wcag/rules/focus_not_obscured_enhanced.rs"
change = "shift the partly-hidden ratio"
find = "const PARTIALLY_HIDDEN_RATIO: f64 = 0.05;"
replace = "const PARTIALLY_HIDDEN_RATIO: f64 = 0.5;"
killed_by = "corpus:interaction_focus_obscured"

[[rule.test_strength.mutations]]
target = "src/wcag/rules/focus_not_obscured_enhanced.rs"
change = "drop the paint-order check"
find = "      if (paintsBelow(overlayEls[k], overlays[k], fel, frect)) continue;"
replace = ""
killed_by = "corpus:interaction_focus_obscured"

[[rule.test_strength.mutations]]
target = "src/wcag/rules/focus_not_obscured_enhanced.rs"
change = "drop the finding"
find = "        if is_partially_hidden(rect, &candidate_overlays) {"
replace = "        if false {"
killed_by = "corpus:interaction_focus_obscured"

[[rule]]
id = "pointer-cancellation"
automation = "manual"
manual_reason = "Whether an action fires on the down-event, or can be aborted or undone, only shows under a real pointer; handlers added by script are invisible in the markup."
method = "page"
source = "WCAG 2.2 SC 2.5.2 Pointer Cancellation"
capabilities = ["dom"]
applicability = "Pages with functionality a single pointer can operate: links, controls, widget roles, tab stops, pointer handler attributes, draggable or editable content, embedded documents, or any script (which can attach listeners unseen)."
expectation = """
One page-wide UNTESTED note (needs_review) on every page with single-pointer
functionality; never pass or violation. A static page without any control,
handler, embedded document or script is not applicable: no note. A page
whose DOM query API fails records the rule as not run."""
page_level = true
ambient = true
positive = ["interaction_click_pointer"]
not_applicable = ["interaction_static_text", "interaction_no_text", "no_focus_targets"]

[rule.variants]
visibility = { not_relevant = "A page-wide note; it does not judge elements." }
native_vs_aria = { not_relevant = "Native controls and widget roles are both signals of the same page-wide note." }
alternative_labels = { not_relevant = "Naming plays no part." }
frames_shadow_dom = { not_relevant = "An iframe counts as possible functionality of the page; its own content is audited as its own document." }
responsive = { not_relevant = "The signals are markup, which does not change with the viewport." }
dynamic = { not_relevant = "Any script already makes the note apply, whatever it adds later." }
thresholds = { not_relevant = "Presence of a signal; no threshold." }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "src/wcag/rules/pointer_cancellation.rs"
change = "invert the applicability gate"
find = "    if !applies {"
replace = "    if applies {"
killed_by = "corpus:interaction_click_pointer"
