# Rule contracts, WCAG group G5: keyboard, focus, pointer, targets, manual
# checks (#783). Format: tests/fixtures/rule_contracts/README.md.
#
# Corpus cases of this group start with `interaction_`; the older cases
# keyboard_and_targets, no_focus_targets, pointer_only,
# scrollable_region_focusable and target_size_* belong here too.

# ── Shared rules (a11y-rules via SHARED_RULES) ───────────────────────────────

[[rule]]
id = "keyboard/positive-tabindex"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=keyboard/positive-tabindex)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 2.4.3 Focus Order; failure F44 (tabindex creating a tab order that does not preserve meaning); HTML §6.6.3 the tabindex attribute"
capabilities = ["dom", "computed_style"]
applicability = "Rendered elements carrying a tabindex attribute that parses as an integer."
expectation = """
A rendered element with tabindex greater than 0 is reported once as
needs_review: a positive value moves it ahead of the natural order, which
fails 2.4.3 only when the resulting order breaks meaning or operation (F44),
and that the markup does not show. tabindex 0 and -1 keep the natural order
and are not reported; the boundary is 1. A display:none element is in no tab
order and is not reported. ARIA widgets (span role=button) and native
controls count alike, so do elements in an open shadow root, a value set by
script after load, and an element rendered on one viewport only."""
positive = ["interaction_tab_order"]
negative = ["interaction_tab_order"]
not_applicable = ["interaction_static_text"]

[rule.variants]
visibility = { cases = ["interaction_tab_order"] }
native_vs_aria = { cases = ["interaction_tab_order"] }
alternative_labels = { not_relevant = "The tab order does not depend on how an element is named." }
frames_shadow_dom = { cases = ["interaction_tab_order"] }
responsive = { cases = ["interaction_tab_order"] }
dynamic = { cases = ["interaction_tab_order"] }
thresholds = { cases = ["interaction_tab_order"] }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/struktur.toml"
change = "2 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id keyboard/positive-tabindex)"

[[rule]]
id = "keyboard/hidden-focusable"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=keyboard/hidden-focusable)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 4.1.2 Name, Role, Value and SC 1.3.1; WAI-ARIA 1.2 §6.7 aria-hidden (authors must not hide focusable content); HTML §6.6.3 tabindex, §6.3 inert"
capabilities = ["dom", "computed_style"]
applicability = "Rendered elements in the sequential tab order (native focusable or tabindex >= 0) that are inside, or carry, aria-hidden=\"true\"."
expectation = """
Fails (violation, one per element) when an element that the Tab key reaches
is hidden from the accessibility tree by aria-hidden="true" on itself or an
ancestor, also across an open shadow root (aria-hidden applies to the flat
tree): keyboard users land on something that is not announced. Passes when
the element is taken out of the tab order (tabindex="-1"), when the hidden
subtree is inert, when it is not rendered, or when aria-hidden is "false".
Native links and ARIA widgets with tabindex 0 count alike, as does
aria-hidden set by a script after load."""
positive = ["interaction_tab_order"]
negative = ["interaction_tab_order"]
not_applicable = ["interaction_static_text"]

[rule.variants]
visibility = { cases = ["interaction_tab_order"] }
native_vs_aria = { cases = ["interaction_tab_order"] }
alternative_labels = { not_relevant = "Hiding from the accessibility tree is independent of how the element is named." }
frames_shadow_dom = { cases = ["interaction_tab_order"] }
responsive = { not_relevant = "aria-hidden and tab order do not change with the viewport; an element not rendered at one viewport is the visibility dimension." }
dynamic = { cases = ["interaction_tab_order"] }
thresholds = { not_relevant = "Presence check on aria-hidden and tab reachability; no numeric threshold." }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/struktur.toml"
change = "2 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
killed_by = "barrierlab:crates/a11y-rules/tests/korpus.rs (xtask/mutate.py --id keyboard/hidden-focusable)"

[[rule]]
id = "keyboard/focusable-no-role"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=keyboard/focusable-no-role)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 2.1.1 Keyboard and SC 4.1.2 Name, Role, Value; WAI-ARIA 1.2 §5.3 (roles of focusable widgets); HTML §6.6.3 tabindex"
capabilities = ["dom", "ax_tree", "computed_style"]
applicability = "Rendered, non-inert elements in the sequential tab order (tabindex >= 0) that are not natively focusable."
expectation = """
needs_review once per element that the Tab key reaches but that has no
interactive role (generic, group, paragraph, none and similar): a keyboard
user lands on it, but nothing tells whether or how it can be operated. Not
reported: tabindex="-1" (a script focus target, not a tab stop; the boundary
is 0), a named region with tabindex="0" (the recommended scrollable-region
pattern), elements that are not rendered. A tabindex added by script after
load counts."""
positive = ["interaction_tab_order", "keyboard_and_targets"]
negative = ["interaction_tab_order"]
not_applicable = ["interaction_static_text"]

[rule.variants]
visibility = { cases = ["interaction_tab_order"] }
native_vs_aria = { cases = ["interaction_tab_order"] }
alternative_labels = { not_relevant = "The check concerns role and tab order; a name does not make an element operable." }
frames_shadow_dom = { not_relevant = "Role and tabindex are read per element of the captured document; a shadow-root element behaves like any other, covered for the same snapshot by keyboard/positive-tabindex in interaction_tab_order." }
responsive = { not_relevant = "Role and tabindex do not change with the viewport; rendering per viewport is the visibility dimension." }
dynamic = { cases = ["interaction_tab_order"] }
thresholds = { cases = ["interaction_tab_order"] }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "barrierlab:crates/a11y-rules/tests/mutations/landmarken.toml"
change = "1 targeted mutation(s) of the shared rule (disable, invert, shift threshold, drop finding)"
