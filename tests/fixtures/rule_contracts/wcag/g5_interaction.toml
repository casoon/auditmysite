[[rule]]
id = "keyboard/interactive-not-focusable"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=keyboard/interactive-not-focusable)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 2.1.1 Keyboard; WAI-ARIA 1.2 §5.3 widget roles and aria-activedescendant; HTML-AAM (a without href is generic)"
capabilities = ["dom", "ax_tree", "computed_style"]
applicability = "Rendered, non-inert elements with an interactive widget role (button, link, checkbox, radio, switch, menuitem*, tab, option, treeitem)."
expectation = """
needs_review once per element that exposes an interactive role but cannot
take keyboard focus (no tabindex, not natively focusable): operating it from
the keyboard depends on script that the markup does not show. Not reported:
native controls, natively disabled fields, native <option>, options or items
whose ancestor manages focus with aria-activedescendant, elements not
rendered. An <a> without href has no link role (HTML-AAM: generic) and is
the business of keyboard/click-handler-not-focusable, not of this rule. A
tabindex removed by script after load counts."""
positive = ["interaction_tab_order"]
negative = ["interaction_tab_order", "interaction_click_anchor"]
not_applicable = ["interaction_static_text"]

[rule.variants]
visibility = { cases = ["interaction_tab_order"] }
native_vs_aria = { cases = ["interaction_tab_order", "interaction_click_anchor"] }
alternative_labels = { not_relevant = "Focusability does not depend on naming; the alternative focus mechanism aria-activedescendant is covered by the negative case in interaction_tab_order." }
frames_shadow_dom = { not_relevant = "Role and focusability are read per element of the captured document; shadow-root elements of the same snapshot are covered by keyboard/positive-tabindex in interaction_tab_order." }
responsive = { not_relevant = "Role and tabindex do not change with the viewport; rendering per viewport is the visibility dimension." }
dynamic = { cases = ["interaction_tab_order"] }
thresholds = { not_relevant = "Presence check on role and focusability; no numeric threshold." }

