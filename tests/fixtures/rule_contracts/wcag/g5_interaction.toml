alternative_labels = { not_relevant = "Naming of the dialog plays no part in whether it is modal." }
frames_shadow_dom = { not_relevant = "2.1.2 for content in an iframe is judged in that document; the rule reads the top document's tree." }
responsive = { not_relevant = "Modality does not change with the viewport." }
dynamic = { cases = ["interaction_dialog_native"] }
