[[rule.test_strength.mutations]]
target = "src/wcag/rules/reflow.rs"
change = "drop the 2D-content exception"
find = "if (el.closest(TWO_D)) {"
replace = "if (false) {"
killed_by = "corpus:visual_reflow_ok"

[[rule]]
id = "text-spacing"
errored = ["error_page_scripts_sabotaged"]
automation = "automated"
method = "page"
source = "WCAG 2.2 SC 1.4.12 Text Spacing; W3C text spacing bookmarklet technique"
capabilities = ["dom", "computed_style", "geometry"]
applicability = "Rendered elements with text that clip their own content (overflow: hidden) in the top document."
expectation = """
Fails when applying the 1.4.12 minimums (line height 1.5, paragraph spacing
2em, letter spacing 0.12em, word spacing 0.16em) makes a container clip text
it did not clip before: a fixed-height badge (20px at line-height 1.2) or a
fixed-width, nowrap label. Content clipped already before the change
(teasers cut by design, the 1x1 visually-hidden pattern) is not caused by
spacing and not reported. A container exactly as tall as one line at 1.5
(24px) still fits; one that grows (min-height) or whose fixed height a
script removes after load passes. The first newly clipped element is
reported (one finding per page and viewport). A page whose probe cannot run
is a technical failure, not a pass."""
positive = ["visual_text_spacing_clipped", "visual_text_spacing_letter"]
negative = ["visual_text_spacing_ok"]
not_applicable = ["visual_no_text"]

