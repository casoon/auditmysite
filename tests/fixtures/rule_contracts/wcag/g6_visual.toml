# Rule contracts, group G6: contrast, text presentation, motion, orientation,
# zoom, display modes, timing (#783). Format: ../README.md.
#
# The corpus runs every case at WCAG level AAA, in the desktop (1280x800,
# landscape) and the mobile pass (390x844, portrait); reflow is measured once
# more at 320x256. Findings of both passes are merged.

# --- Contrast (shared, a11y-rules rendering tier) ----------------------------

[[rule]]
id = "contrast/text-insufficient"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=contrast/text-insufficient)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.4.3 Contrast (Minimum); definitions 'contrast ratio', 'relative luminance', 'large scale (text)'"
capabilities = ["dom", "computed_style", "geometry"]
applicability = "Every element that itself carries rendered, visible text (own non-empty text node; not display:none, visibility:hidden or visually hidden), in the top document, open shadow roots and frames."
expectation = """
Fails when the contrast ratio between the text colour actually painted
(-webkit-text-fill-color wins over color; a translucent foreground is
composited) and the effective background is below 4.5:1, or below 3:1 for
large text (at least 18pt = 24px, or 14pt = 18.66px bold). WCAG forbids
rounding up: 4.48:1 fails, 2.96:1 fails for large text; 4.54:1 and 3.03:1
pass. Text that is not rendered or only visually hidden is not visible text
and is not measured. Text under aria-hidden is still visible text and is
measured (1.4.3 is about what is seen, not the accessibility tree). Text in
a shadow root or a frame is part of the page. A viewport-specific colour
counts in the viewport where it applies; a colour set by script after load
counts as rendered. When the background cannot be resolved (gradient,
background-clip:text, covered by an overlay) the rule does not guess: that
is contrast/text-undetermined, never a pass or fail here."""
positive = ["low_contrast_text", "contrast_shadow_and_inline", "text_fill_color_contrast", "gradient_text_contrast", "visual_contrast_thresholds", "visual_contrast_frame"]
negative = ["visual_contrast_thresholds", "text_fill_color_contrast", "gradient_text_contrast", "visual_contrast_covered", "visual_contrast_frame"]
not_applicable = ["visual_no_text"]

[rule.variants]
visibility = { cases = ["visual_contrast_thresholds"] }
native_vs_aria = { cases = ["visual_contrast_thresholds"] }
alternative_labels = { not_relevant = "Contrast concerns rendered colour, not names; alternative ways of painting glyphs (-webkit-text-fill-color) are covered under positive/negative by text_fill_color_contrast." }
frames_shadow_dom = { cases = ["contrast_shadow_and_inline", "visual_contrast_frame"] }
responsive = { cases = ["visual_contrast_thresholds"] }
dynamic = { cases = ["visual_contrast_thresholds"] }
thresholds = { cases = ["visual_contrast_thresholds"] }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "contrast/text-undetermined"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=contrast/text-undetermined)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.4.3 Contrast (Minimum); a11y-rules rule 3 (not determinable is not a pass)"
capabilities = ["dom", "computed_style", "geometry"]
applicability = "Elements carrying rendered, visible text whose foreground or background colour cannot be resolved, or whose centre is covered by a foreign fixed or sticky element."
expectation = """
Reports a review (UNTESTED) instead of a pass or fail when the contrast cannot
be measured: glyphs painted transparent over a gradient (background-clip:
text), no resolvable colour, or the text covered by a fixed/sticky overlay
such as a cookie banner (the overlay's own text is measurable and not
reported). Over an image or gradient that can be sampled, a median that
passes with a 40th percentile that fails is a borderline review under this
id as well. Text on a solid background never produces this finding. It is
never a confirmed violation."""
positive = ["gradient_text_contrast", "visual_contrast_covered"]
negative = ["visual_contrast_thresholds", "visual_contrast_covered"]
not_applicable = ["visual_no_text"]

[rule.variants]
visibility = { cases = ["visual_contrast_covered"] }
native_vs_aria = { not_relevant = "Whether colours are resolvable does not depend on roles or ARIA attributes." }
alternative_labels = { not_relevant = "Contrast concerns rendered colour, not names." }
frames_shadow_dom = { not_relevant = "Same measurement as contrast/text-insufficient, whose frame and shadow-root traversal is proven there (contrast_shadow_and_inline, visual_contrast_frame); an unresolvable background behaves the same inside them." }
responsive = { not_relevant = "The same measurement runs per viewport; contrast/text-insufficient proves the viewport-specific colour." }
dynamic = { not_relevant = "The same post-load snapshot as contrast/text-insufficient, which proves a colour set by script." }
thresholds = { not_relevant = "The sampled borderline (median passes, 40th percentile fails) depends on screenshot pixels and font rasterisation; no static page pins it reproducibly. The 4.5/3/7 thresholds are proven on contrast/text-insufficient and contrast/text-enhanced." }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "contrast/text-enhanced"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=contrast/text-enhanced)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.4.6 Contrast (Enhanced), Level AAA"
capabilities = ["dom", "computed_style", "geometry"]
applicability = "Visible text that meets 1.4.3; text failing or undetermined under 1.4.3 is reported there, not twice."
expectation = """
Fails when text that meets 1.4.3 stays below 7:1, or below 4.5:1 for large
text. 7.01:1 passes, 6.90:1 fails; large text at 3.03:1 fails here although
it meets 1.4.3. Only reported in an AAA audit (the corpus runs at AAA)."""
positive = ["visual_contrast_thresholds"]
negative = ["visual_contrast_thresholds"]
not_applicable = ["visual_no_text"]

[rule.variants]
visibility = { not_relevant = "Same measurement (which elements count as visible text) as contrast/text-insufficient, proven there; hidden text in visual_contrast_thresholds fails 1.4.3 first and so cannot reach this check." }
native_vs_aria = { not_relevant = "Roles and ARIA do not change rendered colour; aria-hidden text is proven on contrast/text-insufficient." }
alternative_labels = { not_relevant = "Contrast concerns rendered colour, not names." }
frames_shadow_dom = { not_relevant = "Same traversal as contrast/text-insufficient, proven there." }
responsive = { not_relevant = "Same per-viewport measurement as contrast/text-insufficient, proven there." }
dynamic = { not_relevant = "Same post-load snapshot as contrast/text-insufficient, proven there." }
thresholds = { cases = ["visual_contrast_thresholds"] }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "contrast/control-insufficient"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=contrast/control-insufficient)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.4.11 Non-text Contrast (user interface components)"
capabilities = ["dom", "computed_style", "geometry"]
applicability = "Rendered checkboxes, radio buttons, ranges and role checkbox/radio/switch elements drawn by the author (appearance: none)."
expectation = """
Fails when the visual boundary of an author-drawn control (its top border if
drawn, otherwise its own fill) reaches less than 3:1 against the background
behind it; 2.995:1 fails (no rounding), 3.03:1 passes. Native controls drawn
by the browser are not the author's boundary and are not reported. A control
that is not rendered is not measured. An ARIA switch drawn with a span is a
control like a native input. An unresolvable background is
contrast/control-undetermined."""
positive = ["visual_control_contrast"]
negative = ["visual_control_contrast"]
not_applicable = ["visual_contrast_thresholds", "visual_no_text"]

[rule.variants]
visibility = { cases = ["visual_control_contrast"] }
native_vs_aria = { cases = ["visual_control_contrast"] }
alternative_labels = { not_relevant = "The boundary contrast does not depend on how the control is labelled." }
frames_shadow_dom = { not_relevant = "Same rendering-tier traversal as contrast/text-insufficient (frames and shadow roots proven there); controls inside them are measured the same way." }
responsive = { not_relevant = "Custom control styles do not vary between the two audited viewports in common practice; the measurement itself is per viewport like the text contrast." }
dynamic = { not_relevant = "Measured on the post-load snapshot shared with the text contrast, which proves script-set colours." }
thresholds = { cases = ["visual_control_contrast"] }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "contrast/control-undetermined"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=contrast/control-undetermined)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.4.11 Non-text Contrast; a11y-rules rule 3 (not determinable is not a pass)"
capabilities = ["dom", "computed_style", "geometry"]
applicability = "Author-drawn controls (appearance: none) whose background behind the control cannot be resolved (gradient or image)."
expectation = """
Reports a review (UNTESTED) for an author-drawn control whose parent
background is a gradient or image, instead of comparing against white. A
control on a solid background is measured (pass or
contrast/control-insufficient), never reported here."""
positive = ["visual_control_contrast"]
negative = ["visual_control_contrast"]
not_applicable = ["visual_contrast_thresholds", "visual_no_text"]

[rule.variants]
visibility = { not_relevant = "Hidden controls are skipped before the background is looked at, proven on contrast/control-insufficient." }
native_vs_aria = { not_relevant = "Native and ARIA controls reach the same background lookup, proven on contrast/control-insufficient." }
alternative_labels = { not_relevant = "Labelling does not change the background." }
frames_shadow_dom = { not_relevant = "Same traversal as the text contrast rules." }
responsive = { not_relevant = "Same per-viewport measurement as contrast/control-insufficient." }
dynamic = { not_relevant = "Same post-load snapshot as the other contrast rules." }
thresholds = { not_relevant = "No ratio is computed: the background is either resolvable or not." }

[rule.test_strength]
status = "killed"
mutations = []

# --- Text presentation (shared, stylesheet tier) -----------------------------

[[rule]]
id = "text/justified"
errored = ["error_dom_too_deep", "error_stylesheets_unreadable"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=text/justified)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.4.8 Visual Presentation (Level AAA), bullet 3: text is not justified"
capabilities = ["dom", "stylesheets"]
applicability = "Blocks of text: paragraphs with text content that are rendered."
expectation = """
One page-level review when at least one rendered paragraph is set with
text-align: justify, however the author set it: in a stylesheet rule, in the
style attribute, or in a media query that applies in an audited viewport.
Headings, captions and other short labels are not blocks of text. A hidden
paragraph is not presented and does not count. Review, not a violation:
1.4.8 asks for a mechanism, which a user stylesheet may provide."""
page_level = true
positive = ["text_and_layout", "visual_text_presentation", "visual_text_inline_style", "visual_text_media_query"]
negative = ["visual_text_presentation_ok"]
not_applicable = ["visual_no_text"]

[rule.variants]
visibility = { cases = ["visual_text_presentation_ok"] }
native_vs_aria = { not_relevant = "Paragraphs have no ARIA counterpart in practical use (role=paragraph is not used for running text)." }
alternative_labels = { cases = ["visual_text_inline_style"] }
frames_shadow_dom = { not_relevant = "The rule reads the stylesheets of the top document; frame documents carry their own sheets and are not part of this check (scope limit, not a different expectation)." }
responsive = { cases = ["visual_text_media_query"] }
dynamic = { not_relevant = "Stylesheet rules are matched against the DOM after scripts ran; a class added at load is the static case." }
thresholds = { not_relevant = "Presence check on one keyword value, no threshold." }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "text/line-height-tight"
errored = ["error_dom_too_deep", "error_stylesheets_unreadable"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=text/line-height-tight)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.4.8 Visual Presentation (Level AAA), bullet 4: line spacing at least space-and-a-half"
capabilities = ["dom", "stylesheets"]
applicability = "Blocks of text: paragraphs with text content that are rendered."
expectation = """
One page-level review when at least one rendered paragraph has an effective
line height below 1.5 times the font size, from a stylesheet, the style
attribute, or a media query applying in an audited viewport. Exactly 1.5
passes, 1.4 does not. A tight value on html (normalize.css) that the
paragraphs override does not count; captions and headings are not blocks of
text. Review, not a violation."""
page_level = true
positive = ["visual_text_presentation", "visual_text_inline_style", "visual_text_media_query"]
negative = ["visual_text_presentation_ok"]
not_applicable = ["visual_no_text"]

[rule.variants]
visibility = { cases = ["visual_text_presentation_ok"] }
native_vs_aria = { not_relevant = "Paragraphs have no ARIA counterpart in practical use." }
alternative_labels = { cases = ["visual_text_inline_style"] }
frames_shadow_dom = { not_relevant = "The rule reads the stylesheets of the top document; frame documents are not part of this check." }
responsive = { cases = ["visual_text_media_query"] }
dynamic = { not_relevant = "Stylesheet rules are matched against the DOM after scripts ran; a class added at load is the static case." }
thresholds = { cases = ["visual_text_presentation"] }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "visual-presentation"
automation = "manual"
manual_reason = "1.4.8 also requires that users can select foreground and background colours and that text blocks stay within 80 characters; whether a mechanism exists and how wide a block renders for the user's chosen font cannot be decided from markup or style."
method = "page"
source = "WCAG 2.2 SC 1.4.8 Visual Presentation (Level AAA), bullets 1, 2 and 5"
capabilities = ["dom"]
applicability = "Every page in an AAA audit (a fixed page-wide UNTESTED note; justified text and line height are the automated text/* ids)."
expectation = """
Emits one page-wide UNTESTED note in every AAA audit, never a pass and never
a violation. Strictly, 1.4.8 applies only to blocks of text, so a page
without any (visual_no_text) should not get the note; the note is
unconditional today, which is why no not-applicable case exists."""
page_level = true
ambient = true
positive = ["text_and_layout", "visual_text_presentation"]
not_applicable = []

[rule.variants]
visibility = { not_relevant = "Fixed note, no element is inspected." }
native_vs_aria = { not_relevant = "Fixed note, no element is inspected." }
alternative_labels = { not_relevant = "Fixed note, no element is inspected." }
frames_shadow_dom = { not_relevant = "Fixed note, no element is inspected." }
responsive = { not_relevant = "Fixed note, the same in every viewport." }
dynamic = { not_relevant = "Fixed note, independent of page state." }
thresholds = { not_relevant = "Fixed note, no measurement." }

[rule.test_strength]
status = "not_mutable"
reason = "check_visual_presentation_with_page returns a constant UNTESTED note; there is no decision to mutate."

# --- Motion -------------------------------------------------------------------

[[rule]]
id = "motion/reduced-motion-ignored"
errored = ["error_dom_too_deep", "error_stylesheets_unreadable"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=motion/reduced-motion-ignored)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 2.3.3 Animation from Interactions (Level AAA); Media Queries 5 'prefers-reduced-motion'"
capabilities = ["dom", "stylesheets"]
applicability = "Style rules outside a prefers-reduced-motion: reduce block that animate or transition a motion property (transform, translate, rotate, scale, position offsets, ...) on a selector matching an element of the page."
expectation = """
One page-level review when at least one such rule is not switched off under
@media (prefers-reduced-motion: reduce). Switched off means animation: none,
a duration of at most about 50 ms (the usual 0.01ms reset), paused, or
transition: none / transition-property: none, set for the same selector or
by a universal reset. A reduce block that only shortens the movement (0.2s)
does not switch it off. Colour and opacity fades are not motion. Rules whose
selector matches nothing on the page are not evidence. Review, not a
violation: whether the motion is triggered by interaction and is essential is
a human decision."""
page_level = true
positive = ["reduced_motion_transform", "visual_motion_infinite", "visual_motion_reduce_partial"]
negative = ["reduced_motion_override", "reduced_motion_colour_only", "visual_motion_pausable"]
not_applicable = ["visual_motion_none", "visual_contrast_thresholds", "visual_no_text"]

[rule.variants]
visibility = { not_relevant = "A stylesheet check: hover/focus motion can be triggered whether or not the element moves right now. Selectors that match nothing are proven by visual_motion_none." }
native_vs_aria = { not_relevant = "Motion comes from CSS, independent of roles or ARIA." }
alternative_labels = { cases = ["reduced_motion_override", "visual_motion_pausable"] }
frames_shadow_dom = { not_relevant = "The rule reads the stylesheets of the top document; frame documents carry their own sheets and are not part of this check." }
responsive = { not_relevant = "prefers-reduced-motion is a user preference, not a viewport feature; both viewports read the same sheets." }
dynamic = { not_relevant = "Sheets and selector matching are read after scripts ran." }
thresholds = { cases = ["visual_motion_reduce_partial", "reduced_motion_override"] }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "motion/infinite-animation"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=motion/infinite-animation)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 2.2.2 Pause, Stop, Hide (moving content that lasts more than five seconds)"
capabilities = ["dom", "computed_style"]
applicability = "Rendered elements with a running animation whose iteration count is infinite, and marquee elements."
expectation = """
A review at the outermost endlessly animated element (one per group of
siblings) when the page offers no control to pause or stop motion. A finite
animation (iteration count 3) is not endless; an endless animation on an
element that is not rendered moves nothing. A control labelled to pause or
stop (button "Pause animation") is taken as the mechanism; whether it works
is for a human. An animation started by a script after load counts like a
static one. Review, not a violation: an animation may end within five
seconds of the page's own logic, which the snapshot cannot see."""
positive = ["visual_motion_infinite"]
negative = ["visual_motion_pausable", "visual_motion_infinite"]
not_applicable = ["visual_motion_none", "visual_motion_reduce_partial", "visual_contrast_thresholds", "visual_no_text"]

[rule.variants]
visibility = { cases = ["visual_motion_infinite"] }
native_vs_aria = { not_relevant = "Motion comes from CSS or marquee, not from roles; the marquee path is covered by no_focus_targets." }
alternative_labels = { cases = ["visual_motion_pausable"] }
frames_shadow_dom = { not_relevant = "Animations inside frames run in their own document; the computed-style snapshot of the page is what this rule reads." }
responsive = { not_relevant = "Animation declarations rarely differ per viewport; the snapshot is taken in both passes alike." }
dynamic = { cases = ["visual_motion_infinite"] }
thresholds = { cases = ["visual_motion_infinite"] }

[rule.test_strength]
status = "killed"
mutations = []

# --- Orientation -----------------------------------------------------------------

[[rule]]
id = "orientation/content-hidden"
errored = ["error_dom_too_deep", "error_stylesheets_unreadable"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=orientation/content-hidden)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.3.4 Orientation"
capabilities = ["dom", "stylesheets"]
applicability = "Style rules inside an orientation media query that hide (display: none, visibility: hidden) or rotate content, on selectors matching an element of the page."
expectation = """
One page-level review when such a rule exists: content hidden or turned in
one orientation (a timetable hidden in portrait behind a rotate hint, the
body rotated in portrait). Re-laying out content (grid columns) is not
hiding. Pseudo-elements (breakpoint markers) and selectors matching nothing
are not content. A rotation applied by script through an inline style is not
a stylesheet rule and not this id's (css-orientation-lock measures it).
Review, not a violation: whether the hidden content is available in the
other orientation, or the orientation essential, is a human decision."""
page_level = true
positive = ["visual_orientation_lock", "visual_orientation_hide"]
negative = ["visual_orientation_ok"]
not_applicable = ["visual_orientation_script_lock", "visual_contrast_thresholds", "visual_no_text"]

[rule.variants]
visibility = { cases = ["visual_orientation_ok"] }
native_vs_aria = { not_relevant = "Orientation media queries are CSS, independent of roles or ARIA." }
alternative_labels = { cases = ["visual_orientation_lock", "visual_orientation_hide"] }
frames_shadow_dom = { not_relevant = "The rule reads the stylesheets of the top document; frame documents are not part of this check." }
responsive = { cases = ["visual_orientation_hide", "visual_orientation_lock"] }
dynamic = { cases = ["visual_orientation_script_lock"] }
thresholds = { not_relevant = "Presence check on hiding/rotating declarations, no threshold." }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "css-orientation-lock"
errored = ["error_page_scripts_sabotaged"]
automation = "automated"
method = "page"
source = "WCAG 2.2 SC 1.3.4 Orientation"
capabilities = ["computed_style"]
applicability = "The root elements html and body of the top document, in each audited viewport: every page has them, so there is no page the check does not apply to."
expectation = """
Fails when html or body is rotated in the audited viewport (computed
transform with a rotation component, or the rotate property), which turns the
whole page sideways: in the mobile (portrait) pass this is the classic lock
that forces landscape, whether set by an orientation media query or by a
script reacting to the orientation. The finding names the rotated element.
A full turn (360deg), a translation or no transform is no rotation. Rotations
by a multiple of 180deg do not swap the axes and are not reported. A page
whose computed style cannot be read is a technical failure, not a pass."""
always_applicable = true
positive = ["visual_orientation_lock", "visual_orientation_script_lock"]
negative = ["visual_orientation_ok", "visual_orientation_hide"]

[rule.variants]
visibility = { not_relevant = "html and body are always present; the check is about their geometry, not their visibility." }
native_vs_aria = { not_relevant = "Only the root elements are inspected; roles do not apply." }
alternative_labels = { cases = ["visual_orientation_lock", "visual_orientation_script_lock"] }
frames_shadow_dom = { not_relevant = "Orientation lock concerns the top document's root elements; a frame cannot rotate the page." }
responsive = { cases = ["visual_orientation_lock"] }
dynamic = { cases = ["visual_orientation_script_lock"] }
thresholds = { cases = ["visual_orientation_ok"] }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "src/wcag/rules/orientation.rs"
change = "disable rotation detection in the transform matrix"
find = "if (Math.abs(b) > 0.01 && Math.abs(b + c) < 0.01) {"
replace = "if (false) {"
killed_by = "corpus:visual_orientation_lock,visual_orientation_script_lock"

[[rule.test_strength.mutations]]
target = "src/wcag/rules/orientation.rs"
change = "invert the decisive locked condition"
find = "if !locked {"
replace = "if locked {"
killed_by = "corpus:visual_orientation_ok,visual_orientation_lock"

# --- Zoom (shared, viewport meta) ----------------------------------------------

[[rule]]
id = "zoom/viewport-locked"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=zoom/viewport-locked)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 1.4.4 Resize Text; CSS Device Adaptation / viewport meta 'parsing the content attribute'"
capabilities = ["dom"]
applicability = "meta name=viewport elements of the document (also when inserted by script)."
expectation = """
Fails at the meta element when it disables zooming (user-scalable=no or 0)
or caps maximum-scale below 2, which prevents resizing text to 200 percent.
Values are parsed as browsers do: comma, semicolon or whitespace separate
pairs, whitespace around '=' belongs to the pair, case does not matter.
maximum-scale=1.9 fails, 2 does not (that is zoom/viewport-scale-limited).
No viewport meta at all is zoom/viewport-missing, not this id."""
positive = ["restrictive_viewport", "visual_viewport_scale_below_two", "visual_viewport_alt_syntax", "visual_viewport_script"]
negative = ["visual_viewport_scale_two", "visual_viewport_scale_five"]
not_applicable = ["visual_viewport_missing"]

[rule.variants]
visibility = { not_relevant = "A meta element is never rendered; visibility does not exist for it." }
native_vs_aria = { not_relevant = "The viewport meta has no ARIA counterpart." }
alternative_labels = { cases = ["visual_viewport_alt_syntax"] }
frames_shadow_dom = { not_relevant = "Only the top document's viewport meta governs zoom; a frame's is ignored by browsers." }
responsive = { not_relevant = "The declaration is the same in both viewports." }
dynamic = { cases = ["visual_viewport_script"] }
thresholds = { cases = ["visual_viewport_scale_below_two", "visual_viewport_scale_two"] }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "zoom/viewport-scale-limited"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=zoom/viewport-scale-limited)"]
automation = "automated"
method = "shared"
source = "Best practice beyond WCAG 2.2 SC 1.4.4 (zoom capped between 200 and 500 percent)"
capabilities = ["dom"]
applicability = "meta name=viewport elements that allow at least 200 percent zoom."
expectation = """
