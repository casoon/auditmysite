# --- Timing ---------------------------------------------------------------------

[[rule]]
id = "timing/meta-refresh"
errored = ["error_dom_too_deep"]
shared_tests = ["barrierlab:crates/a11y-rules/tests/korpus.rs::korpus_faelle (KORPUS_ID=timing/meta-refresh)"]
automation = "automated"
method = "shared"
source = "WCAG 2.2 SC 2.2.1 Timing Adjustable (20-hour exception); technique H76/F40/F41; HTML 'shared declarative refresh steps'"
capabilities = ["dom"]
applicability = "meta elements with http-equiv=refresh (any case) whose content starts with digits, also when inserted by script."
expectation = """
Fails at the meta element when it reloads or redirects after a delay of
1 s up to just under 20 hours (71999 s fails, 72000 s is the 20-hour
exception and passes): users can neither stop nor extend it. Attribute case,
leading whitespace and a url part do not matter. Content without leading
digits is ignored by browsers and passes. A delay of 0 is an immediate
redirect, not a time limit (H76); it is not exercised in the corpus because
it would navigate the fixture away."""
positive = ["meta_refresh_present", "visual_meta_refresh_redirect"]
negative = ["visual_meta_refresh_exempt"]
not_applicable = ["visual_contrast_thresholds", "visual_no_text"]

[rule.variants]
visibility = { not_relevant = "A meta element is never rendered." }
native_vs_aria = { not_relevant = "meta refresh has no ARIA counterpart." }
alternative_labels = { cases = ["visual_meta_refresh_redirect"] }
frames_shadow_dom = { not_relevant = "A refresh inside a frame reloads only that frame's document; the shared rule reads the top document (scope limit, not a different expectation)." }
responsive = { not_relevant = "The declaration is the same in both viewports." }
dynamic = { cases = ["visual_meta_refresh_redirect"] }
thresholds = { cases = ["visual_meta_refresh_redirect", "visual_meta_refresh_exempt"] }

[rule.test_strength]
status = "killed"
mutations = []

[[rule]]
id = "meta-refresh"
automation = "manual"
manual_reason = "Script-driven time limits (setTimeout/setInterval, session expiry) and whether users can turn them off, adjust or extend them are not visible in the DOM. The id is historical: it names the 2.2.1 page note for script time limits, while the actual meta refresh detection is timing/meta-refresh."
method = "page"
source = "WCAG 2.2 SC 2.2.1 Timing Adjustable"
capabilities = ["dom"]
applicability = "Every page (a fixed page-wide UNTESTED note)."
expectation = """
Emits one page-wide UNTESTED note on every page, never a pass and never a
violation. Strictly, 2.2.1 applies only where content sets a time limit, so
a page without scripts or forms would be out of scope; the note is
unconditional today, which is why no not-applicable case exists."""
page_level = true
ambient = true
positive = ["visual_meta_refresh_redirect"]
not_applicable = []

[rule.variants]
