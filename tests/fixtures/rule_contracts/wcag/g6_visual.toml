# --- Reflow and text spacing (local) ---------------------------------------------

[[rule]]
id = "css-overflow-hidden"
errored = ["error_page_scripts_sabotaged"]
automation = "automated"
method = "pipeline"
source = "WCAG 2.2 SC 1.4.10 Reflow (320 CSS px width; exception for content requiring two-dimensional layout)"
capabilities = ["geometry", "interaction"]
applicability = "The page at a 320 x 256 CSS px viewport (run once after the mobile pass), except content that needs two-dimensional layout: data tables, images, maps, diagrams, video, application areas."
expectation = """
Fails when the document needs horizontal scrolling at 320 CSS px (scroll
width more than 5 px beyond the viewport) because of content that should
reflow; the finding names the widest such element. Exactly 320 px wide
content passes. A fixed width that only applies above 400 px does not apply
at 320 px. A width capped by script after load passes. Overflow caused only
by a data table, image or other 2D content is excepted by the criterion and
passes; a layout table (role=presentation/none) is not excepted. Overflowing
text without a wider element box (an unbroken string) still fails. A page
whose only wide content is such 2D content (visual_no_text: one image) has
nothing the criterion applies to."""
positive = ["visual_reflow_fixed_width"]
negative = ["visual_reflow_ok"]
not_applicable = ["visual_no_text"]

[rule.variants]
visibility = { not_relevant = "An element that is not rendered has no box and cannot widen the document; only rendered geometry is measured." }
native_vs_aria = { not_relevant = "The 2D exception keys on native table/img/video as well as role table/grid/img; no separate decision path." }
alternative_labels = { not_relevant = "Reflow does not depend on names or labels." }
frames_shadow_dom = { not_relevant = "Content of a frame scrolls inside the frame; only the top document's scroll width is the page's reflow." }
responsive = { cases = ["visual_reflow_ok"] }
dynamic = { cases = ["visual_reflow_ok"] }
thresholds = { cases = ["visual_reflow_ok", "visual_reflow_fixed_width"] }

[rule.test_strength]
status = "killed"

[[rule.test_strength.mutations]]
target = "src/wcag/rules/reflow.rs"
