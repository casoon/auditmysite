visibility = { cases = ["visual_text_spacing_clipped"] }
native_vs_aria = { not_relevant = "Clipping is geometry, independent of roles or ARIA." }
alternative_labels = { not_relevant = "Clipping does not depend on names; the alternative spacing properties (letter spacing) are proven by visual_text_spacing_letter." }
frames_shadow_dom = { not_relevant = "The probe applies the spacing stylesheet to the top document only; frame documents and shadow roots keep their own styles (known scope limit of the probe, not a different expectation)." }
responsive = { not_relevant = "The probe runs in both viewports with the same logic; which container clips may differ, the decision does not." }
