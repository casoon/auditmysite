# Rule contracts for the schema_rules corpus (#783). Format: tests/fixtures/rule_contracts/README.md.
# Method `detect_structured_data` (JSON-LD from the rendered DOM) with the rule profiles of
# web-checks (barrierlab), run through `audit_page` with the SEO module so that the
# merchant-listing context is the real one. Profiles follow Google Search Central's
# structured-data documentation as of 2026-10.

[[rule]]
id = "product_snippet"
automation = "automated"
method = "detect_structured_data"
source = "https://developers.google.com/search/docs/appearance/structured-data/product-snippet (required: name; one of review, aggregateRating, offers; offers need price, AggregateOffer lowPrice and priceCurrency)"
capabilities = ["dom"]
applicability = "Applies to JSON-LD nodes of type Product in the audited document (top level, top-level arrays, @graph entries; full schema.org IRIs count as the short type). Microdata and RDFa are outside this method."
expectation = """
Fails when a Product node lacks name, or has none of review / aggregateRating / offers, or an offer without price (AggregateOffer: lowPrice and priceCurrency). No recommended properties are profiled here, so a node meeting the requirements passes. Nested property values (an author Person, a provider Organization) are not nodes of their own and are not assessed; a page without a node of the type is not applicable. A page whose structured-data collection fails is not run for every feature, never clean."""
page_level = true
positive = ["schema_rules_graph_and_arrays", "schema_rules_incomplete"]
negative = ["schema_rules_complete", "schema_rules_merchant_listing_complete", "schema_rules_merchant_listing_incomplete"]
not_applicable = ["schema_rules_iframe_only", "schema_rules_none", "schema_rules_not_applicable"]
errored = ["schema_rules_error_scripts_sabotaged"]

[rule.variants]
visibility = { not_relevant = "JSON-LD is never rendered; whether marked-up facts are visible is the separate content-parity check." }
native_vs_aria = { not_relevant = "Structured data has no ARIA counterpart." }
alternative_labels = { cases = ["schema_rules_graph_and_arrays"] }
frames_shadow_dom = { cases = ["schema_rules_iframe_only"] }
responsive = { not_relevant = "Structured data is collected once from the DOM and does not depend on the viewport." }
dynamic = { not_relevant = "JSON-LD is read from the rendered DOM after load, so injected blocks count like static ones (schema_rules_dynamic_injection shows it with Article and Event)." }
thresholds = { not_relevant = "Presence checks; no numeric threshold in this profile." }

[rule.test_strength]
status = "killed"
[[rule.test_strength.mutations]]
target = "src/seo/schema.rs"
change = "drop every assessment (valid nodes filtered out)"
find = ".filter(|(_, schema)| schema.is_valid)"
replace = ".filter(|(_, schema)| !schema.is_valid)"
killed_by = "test:schema_rules_detection_corpus_test"
[[rule.test_strength.mutations]]
target = "barrierlab:crates/web-checks/src/structured_data/rules.rs"
change = "web-checks assess_node profile for product_snippet: drop or weaken its required/recommended checks (verified by barrierlab's own catalog; placeholder)"
killed_by = "barrierlab:crates/web-checks/src/structured_data/rules.rs::tests"

[[rule]]
id = "merchant_listing"
automation = "automated"
method = "detect_structured_data"
source = "https://developers.google.com/search/docs/appearance/structured-data/merchant-listing (required: name, image, offers with price and priceCurrency; recommended: description, sku, brand.name, offers.availability)"
capabilities = ["dom"]
applicability = "Applies to JSON-LD nodes of type Product on a purchasable product detail page in the audited document (top level, top-level arrays, @graph entries; full schema.org IRIs count as the short type). Microdata and RDFa are outside this method."
expectation = """
Applies only where the page is a purchasable product detail page; the audit establishes that from the visible page intent (shop) and the product route in the SEO module's derive step. Where that context is not established the Product gets needs_review (context unknown), never a pass or a violation. On a product detail page: fails when name, image or an Offer with price and priceCurrency is missing; with them present and recommended properties missing it is needs_review (Google's Rich Results Test reports missing recommended properties as non-critical issues (eligible, but a human should decide whether the data exists)); all present passes. Nested property values (an author Person, a provider Organization) are not nodes of their own and are not assessed; a page without a node of the type is not applicable. A page whose structured-data collection fails is not run for every feature, never clean."""
page_level = true
positive = ["schema_rules_complete", "schema_rules_graph_and_arrays", "schema_rules_incomplete", "schema_rules_merchant_listing_incomplete"]
negative = ["schema_rules_merchant_listing_complete"]
not_applicable = ["schema_rules_iframe_only", "schema_rules_none", "schema_rules_not_applicable"]
errored = ["schema_rules_error_scripts_sabotaged"]

[rule.variants]
visibility = { not_relevant = "JSON-LD is never rendered; whether marked-up facts are visible is the separate content-parity check." }
native_vs_aria = { not_relevant = "Structured data has no ARIA counterpart." }
alternative_labels = { cases = ["schema_rules_graph_and_arrays"] }
frames_shadow_dom = { cases = ["schema_rules_iframe_only"] }
responsive = { not_relevant = "Structured data is collected once from the DOM and does not depend on the viewport." }
dynamic = { not_relevant = "JSON-LD is read from the rendered DOM after load, so injected blocks count like static ones (schema_rules_dynamic_injection shows it with Article and Event)." }
thresholds = { not_relevant = "Presence checks; no numeric threshold in this profile." }

[rule.test_strength]
status = "killed"
[[rule.test_strength.mutations]]
target = "src/seo/schema.rs"
change = "drop every assessment (valid nodes filtered out)"
find = ".filter(|(_, schema)| schema.is_valid)"
replace = ".filter(|(_, schema)| !schema.is_valid)"
killed_by = "test:schema_rules_detection_corpus_test"
[[rule.test_strength.mutations]]
target = "src/seo/schema.rs"
change = "ignore the established product context (always indeterminate)"
find = "build_rule_assessments(&structured_data.json_ld, product_context);"
replace = "build_rule_assessments(&structured_data.json_ld, crate::seo::schema_rules::ProductRuleContext::Indeterminate);"
killed_by = "test:schema_rules_detection_corpus_test"
[[rule.test_strength.mutations]]
target = "barrierlab:crates/web-checks/src/structured_data/rules.rs"
change = "web-checks assess_node profile for merchant_listing: drop or weaken its required/recommended checks (verified by barrierlab's own catalog; placeholder)"
killed_by = "barrierlab:crates/web-checks/src/structured_data/rules.rs::tests"

