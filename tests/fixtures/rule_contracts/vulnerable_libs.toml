[[rule.test_strength.mutations]]
target = "src/best_practices/vulnerable_libs.rs"
change = "restore the outdated 4.17.21 boundary"
find = "fixed: (4, 18, 0) }]"
replace = "fixed: (4, 17, 21) }]"
killed_by = "test:vulnerable_libs_detection_corpus_test"

[[rule]]
id = "Underscore"
automation = "automated"
method = "analyze_vulnerable_libraries"
source = "retire.js jsrepository-v4.json (GitHub/NVD advisories), reviewed 2026-10-26; CVE-2021-23358 (< 1.12.1), CVE-2026-27601 (< 1.13.8)"
capabilities = ["dom"]
applicability = "Applies to pages on which the library is detected: its window global (with its version field) or, for jQuery, Bootstrap, AngularJS, Lodash and Handlebars, a script URL whose path names the library and a version."
expectation = """
Fails for every Underscore below 1.13.8; 1.13.8 and later pass. Detected through `_.VERSION` without `_.runInContext` (with it, `_` is Lodash). Underscore has no URL channel in this detector. A page without the library: not applicable. A page that breaks the detection scripts (result missing or malformed) is not run for every library, never clean."""
page_level = true
positive = ["vulnerable_libs_outdated_underscore_and_legacy", "vulnerable_libs_underscore_last_vulnerable"]
negative = ["vulnerable_libs_current_underscore"]
not_applicable = ["vulnerable_libs_none"]
errored = ["vulnerable_libs_error_scripts_sabotaged"]

[rule.variants]
visibility = { not_relevant = "Detects loaded code (window globals, script URLs), not rendered content." }
native_vs_aria = { not_relevant = "Script libraries have no ARIA counterpart." }
alternative_labels = { cases = ["vulnerable_libs_current_underscore"] }
frames_shadow_dom = { not_relevant = "Globals and <script src> are read from the top document; a framed document is audited as its own page." }
responsive = { not_relevant = "Library globals do not depend on the viewport." }
dynamic = { not_relevant = "Underscore and Lodash share `_`; the dynamic case injects Lodash. Globals are read after load in either case, so a later definition is read like an initial one." }
thresholds = { cases = ["vulnerable_libs_underscore_last_vulnerable", "vulnerable_libs_current_underscore"] }

[rule.test_strength]
status = "killed"
[[rule.test_strength.mutations]]
target = "src/best_practices/vulnerable_libs.rs"
change = "restore the outdated 1.13.0 boundary"
find = "fixed: (1, 13, 8) }]"
replace = "fixed: (1, 13, 0) }]"
killed_by = "test:vulnerable_libs_detection_corpus_test"
[[rule.test_strength.mutations]]
target = "src/best_practices/vulnerable_libs.rs"
change = "drop the Lodash/Underscore distinction"
find = "typeof _ !== 'undefined' && _.VERSION && typeof _.runInContext !== 'function'"
replace = "typeof _ !== 'undefined' && _.VERSION && typeof _.runInContext === 'function'"
killed_by = "test:vulnerable_libs_detection_corpus_test"

