Fails for every Lodash below 4.18.0; 4.18.0 and later pass. Detected through `_.VERSION` together with `_.runInContext` (Lodash-only; without it `_` is Underscore) or a script path naming lodash with a version. A page without the library: not applicable. A page that breaks the detection scripts (result missing or malformed) is not run for every library, never clean."""
page_level = true
positive = ["vulnerable_libs_boundaries_last_vulnerable", "vulnerable_libs_dynamic_injection", "vulnerable_libs_outdated_lodash", "vulnerable_libs_url_detected"]
negative = ["vulnerable_libs_boundaries_first_safe", "vulnerable_libs_current_lodash", "vulnerable_libs_url_current"]
not_applicable = ["vulnerable_libs_none"]
errored = ["vulnerable_libs_error_scripts_sabotaged"]

[rule.variants]
visibility = { not_relevant = "Detects loaded code (window globals, script URLs), not rendered content." }
native_vs_aria = { not_relevant = "Script libraries have no ARIA counterpart." }
alternative_labels = { cases = ["vulnerable_libs_url_detected", "vulnerable_libs_url_current"] }
frames_shadow_dom = { not_relevant = "Globals and <script src> are read from the top document; a framed document is audited as its own page." }
responsive = { not_relevant = "Library globals do not depend on the viewport." }
dynamic = { cases = ["vulnerable_libs_dynamic_injection"] }
thresholds = { cases = ["vulnerable_libs_boundaries_last_vulnerable", "vulnerable_libs_boundaries_first_safe", "vulnerable_libs_current_lodash"] }

[rule.test_strength]
