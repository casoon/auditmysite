[[rule]]
id = "Content-Security-Policy:missing_header"
automation = "automated"
method = "analyze_security"
source = "CSP Level 3, 'The Content-Security-Policy HTTP Response Header Field' and 'Policy lists'; OWASP Secure Headers Project"
capabilities = ["network"]
applicability = "Applies to every successfully fetched document response. Always applicable: the check judges the response itself (its transport or one of its headers), and every successfully fetched response has a scheme and a header set, so no page lies outside its scope."
expectation = """
Fails when the response carries no enforced Content-Security-Policy header. A Content-Security-Policy-Report-Only header does not enforce anything (CSP3, report-only header) and does not count. Field names are case-insensitive (RFC 9110 §5.1); several CSP headers form one policy list and count as present.

Always applicable: every document response is in scope. Known gap: a policy delivered by <meta http-equiv> (CSP3, 'The <meta> element') is enforced by browsers but not read by this header-only analyzer."""
page_level = true
always_applicable = true
positive = ["no_headers_at_all", "security_csp_report_only"]
negative = ["baseline_headers_present", "csp_permissive", "security_csp_policy_list", "security_csp_policy_list_both_weak", "security_header_names_mixed_case", "security_https_complete", "security_https_without_hsts"]
not_applicable = []
errored = ["security_error_status_500", "security_error_untrusted_certificate"]
error_test = "security_unreachable_server_is_not_measured"

[rule.variants]
visibility = { not_relevant = "Response headers are not rendered content; there is no visible or hidden state." }
native_vs_aria = { not_relevant = "HTTP response headers have no ARIA counterpart." }
alternative_labels = { cases = ["security_header_names_mixed_case", "security_csp_policy_list", "security_csp_report_only"] }
frames_shadow_dom = { not_relevant = "Only the response of the audited URL is read; a framed document is a separate response, audited as its own page." }
responsive = { not_relevant = "Fetched outside the browser; no viewport is involved." }
dynamic = { not_relevant = "Headers come from one HTTP response; scripts running after load cannot change them." }
thresholds = { not_relevant = "Presence check, no numeric threshold." }

