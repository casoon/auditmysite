# Rule contracts for the security corpus (#783). Format: tests/fixtures/rule_contracts/README.md.
# Method `analyze_security`: one HTTP probe of the audited URL outside the browser
# (tests/security_detection_corpus_test.rs serves every case from
# tests/common/routing_server.rs, over HTTP or HTTPS with a corpus-only CA).

[[rule]]
id = "Access-Control-Allow-Origin:cors_wildcard_credentials"
automation = "automated"
method = "analyze_security"
source = "Fetch Standard, 'CORS protocol and credentials' and 'CORS check' (`*` never matches a credentialed request)"
capabilities = ["network"]
applicability = "Applies to responses that carry Access-Control-Allow-Origin."
expectation = """
Fails when Access-Control-Allow-Origin is `*` and Access-Control-Allow-Credentials is `true`: a contradictory configuration that signals an intent to share credentialed responses with any origin. Optional whitespace around values is not part of them (RFC 9110 §5.5). `*` without credentials and credentials for one named origin pass. Without Access-Control-Allow-Origin the check does not apply."""
page_level = true
positive = ["cors_wildcard_credentials", "security_cors_padded_wildcard_credentials"]
negative = ["cors_wildcard_without_credentials", "security_cors_specific_origin_credentials"]
not_applicable = ["baseline_headers_present", "no_headers_at_all", "security_https_complete", "security_https_without_hsts"]
errored = ["security_error_status_500", "security_error_untrusted_certificate"]
error_test = "security_unreachable_server_is_not_measured"

[rule.variants]
visibility = { not_relevant = "Response headers are not rendered content; there is no visible or hidden state." }
native_vs_aria = { not_relevant = "HTTP response headers have no ARIA counterpart." }
alternative_labels = { cases = ["security_cors_padded_wildcard_credentials", "security_cors_specific_origin_credentials"] }
frames_shadow_dom = { not_relevant = "Only the response of the audited URL is read; a framed document is a separate response, audited as its own page." }
responsive = { not_relevant = "Fetched outside the browser; no viewport is involved." }
dynamic = { not_relevant = "Headers come from one HTTP response; scripts running after load cannot change them." }
thresholds = { not_relevant = "Presence check, no numeric threshold." }

[rule.test_strength]
status = "killed"
[[rule.test_strength.mutations]]
target = "src/security/mod.rs"
change = "invert the wildcard-origin condition"
find = ".is_some_and(|origin| origin.trim() == \"*\")"
replace = ".is_some_and(|origin| origin.trim() != \"*\")"
killed_by = "test:security_detection_corpus_test"

[[rule]]
id = "Content-Security-Policy:missing_base-uri"
automation = "automated"
method = "analyze_security"
source = "CSP Level 3, 'Directives' (script-src, style-src and object-src fall back to default-src; base-uri and frame-ancestors have no fallback), 'Does a source list allow all inline behavior for type?' ('unsafe-inline' is ignored next to a nonce or hash), 'Policy lists' (every policy is enforced); Google CSP Evaluator"
capabilities = ["network"]
applicability = "Applies to responses with at least one enforced Content-Security-Policy header; without one (or with only a report-only policy) there is no policy to judge."
expectation = """
Fails when no policy restricts base-uri; it has no fallback to default-src. Without an enforced CSP the check does not apply (that is the missing_header finding)."""
page_level = true
positive = ["csp_permissive", "security_csp_policy_list_both_weak"]
negative = ["baseline_headers_present", "security_csp_host_wildcards", "security_csp_policy_list", "security_csp_without_default_src", "security_header_names_mixed_case", "security_https_complete"]
not_applicable = ["no_headers_at_all", "security_csp_report_only"]
errored = ["security_error_status_500", "security_error_untrusted_certificate"]
error_test = "security_unreachable_server_is_not_measured"

