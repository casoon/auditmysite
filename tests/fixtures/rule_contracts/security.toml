[[rule]]
id = "Cross-Origin-Opener-Policy:missing_header"
automation = "automated"
method = "analyze_security"
source = "HTML Standard, 'Cross-origin opener policies'; auditmysite #578 header tiers"
capabilities = ["network"]
applicability = "Applies to every successfully fetched top-level document response. Always applicable: the check judges the response itself (its transport or one of its headers), and every successfully fetched response has a scheme and a header set, so no page lies outside its scope."
expectation = """
Reports a review (needs_review), never a confirmed violation, when the response sets no Cross-Origin-Opener-Policy: COOP is an opt-in isolation mechanism whose need depends on deployment context (SharedArrayBuffer, cross-origin popups) that a single fetch cannot observe, so the finding asks a human to verify. A present header passes."""
page_level = true
always_applicable = true
positive = ["no_headers_at_all"]
negative = ["baseline_headers_present", "security_header_names_mixed_case", "security_https_complete", "security_https_without_hsts"]
not_applicable = []
errored = ["security_error_status_500", "security_error_untrusted_certificate"]
error_test = "security_unreachable_server_is_not_measured"

[rule.variants]
visibility = { not_relevant = "Response headers are not rendered content; there is no visible or hidden state." }
native_vs_aria = { not_relevant = "HTTP response headers have no ARIA counterpart." }
