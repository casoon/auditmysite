status = "killed"
[[rule.test_strength.mutations]]
target = "src/security/mod.rs"
change = "disable detection: Content-Security-Policy:missing_header never reported"
find = "    if headers.content_security_policy.is_none() {\n        issues.push(security_issue("
replace = "    if false {\n        issues.push(security_issue("
killed_by = "test:security_detection_corpus_test"

