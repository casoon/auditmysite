<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Current jQuery, Bootstrap, Handlebars and Lodash</title>
  <script>
    // Minimal global stubs: the analyzer reads only the version fields.
    window.jQuery = { fn: { jquery: "3.7.1" } };
    window.Handlebars = { VERSION: "4.7.10" };
    // 4.18.0 is the first release outside every Lodash advisory (CVE-2026-4800).
    window._ = { VERSION: "4.18.0", runInContext: function () {} };
  </script>
</head>
<body>
  <header><p>Library corpus</p></header>
  <main>
    <h1>Current jQuery, Bootstrap, Handlebars and Lodash</h1>
    <div data-bs-version="5.3.2"></div>
  </main>
</body>
</html>
