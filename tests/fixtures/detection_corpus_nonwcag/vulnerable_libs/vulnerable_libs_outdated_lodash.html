<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outdated jQuery, Bootstrap, AngularJS, Handlebars and Lodash</title>
  <script>
    window.jQuery = { fn: { jquery: "1.9.0" } };
    window.angular = { version: { full: "1.7.9" } };
    window.Handlebars = { VERSION: "4.5.2" };
    window._ = { VERSION: "4.17.20", runInContext: function () {} };
  </script>
</head>
<body>
  <header><p>Library corpus</p></header>
  <main>
    <h1>Outdated jQuery, Bootstrap, AngularJS, Handlebars and Lodash</h1>
    <!-- Bootstrap read from the data-bs-version attribute when no global is set. -->
    <div data-bs-version="3.4.0"></div>
  </main>
</body>
</html>
