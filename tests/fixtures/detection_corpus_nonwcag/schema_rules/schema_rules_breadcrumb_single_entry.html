<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breadcrumb with a single entry</title>
  <script type="application/ld+json">
  {"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://example.com/"}]}
  </script>
</head>
<body>
  <header><p>Example</p></header>
  <main>
    <h1>Breadcrumb with a single entry</h1>
    <p>Structured data corpus page.</p>
  </main>
  <footer><p>Footer</p></footer>
</body>
</html>
