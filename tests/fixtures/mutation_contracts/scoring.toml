# Mutations of the accessibility score computation (#117). A surviving mutant means the
# tests run this code but do not assert on it. Same fields as the rule contracts' mutations,
# plus `id`. Run: scripts/mutation-check.py --rule <id>

[[mutation]]
id = "scoring-diversity-threshold"
target = "src/audit/scoring.rs"
change = "start the diversity surcharge at 5 criteria instead of 4"
find = "if unique_criteria <= 3 {"
replace = "if unique_criteria <= 4 {"
killed_by = "lib:audit::scoring"

[[mutation]]
id = "scoring-diversity-cap"
target = "src/audit/scoring.rs"
change = "raise the diversity cap from 1.5 to 2.0"
find = "(unique_criteria as f32 / 5.0).ln())).min(1.5)"
replace = "(unique_criteria as f32 / 5.0).ln())).min(2.0)"
killed_by = "lib:audit::scoring"

[[mutation]]
id = "scoring-compression-knee"
target = "src/audit/scoring.rs"
change = "move the compression knee from 70 to 60"
find = "const COMPRESSION_KNEE: f32 = 70.0;"
replace = "const COMPRESSION_KNEE: f32 = 60.0;"
killed_by = "lib:audit::scoring"

[[mutation]]
id = "scoring-compression-slope"
target = "src/audit/scoring.rs"
change = "halve the square-root slope above the knee"
find = "(total_penalty - COMPRESSION_KNEE).sqrt() * 2.0"
replace = "(total_penalty - COMPRESSION_KNEE).sqrt() * 1.0"
killed_by = "lib:audit::scoring"

[[mutation]]
id = "scoring-soft-floor-start"
target = "src/audit/scoring.rs"
change = "start the soft floor at 10 instead of 15"
find = "const SOFT_FLOOR_START: f32 = 15.0;"
replace = "const SOFT_FLOOR_START: f32 = 10.0;"
killed_by = "lib:audit::scoring"

[[mutation]]
id = "scoring-soft-floor-decay"
target = "src/audit/scoring.rs"
change = "make the soft floor decay twice as fast"
find = "/ 8.0).exp()"
replace = "/ 4.0).exp()"
killed_by = "lib:audit::scoring"

[[mutation]]
id = "scoring-cap-critical"
target = "src/audit/scoring.rs"
change = "let one critical finding keep a score of 50"
find = "if critical_occurrences >= 1 {\n        49.0"
replace = "if critical_occurrences >= 1 {\n        50.0"
killed_by = "lib:audit::scoring"

[[mutation]]
id = "scoring-cap-level-a"
target = "src/audit/scoring.rs"
change = "let a Level A high finding keep a score of 90"
find = "} else if level_a_urgent_occurrences >= 1 {\n        89.0"
replace = "} else if level_a_urgent_occurrences >= 1 {\n        90.0"
killed_by = "lib:audit::scoring"

[[mutation]]
id = "scoring-cap-urgent-count"
target = "src/audit/scoring.rs"
change = "require six urgent findings for the 92 cap instead of five"
find = "} else if urgent_occurrences >= 5 {"
replace = "} else if urgent_occurrences >= 6 {"
killed_by = "lib:audit::scoring"

# Not listed: "highest severity of a rule wins" went away with the taxonomy rework (#918); the
# per-criterion penalty no longer depends on the severity of a finding.

[[mutation]]
id = "scoring-level-a-urgent"
target = "src/audit/scoring.rs"
change = "count non-Level-A findings as Level A urgent"
find = "v.level == crate::cli::WcagLevel::A\n                    && matches!(v.severity, Severity::High | Severity::Critical)"
replace = "v.level != crate::cli::WcagLevel::A\n                    && matches!(v.severity, Severity::High | Severity::Critical)"
killed_by = "lib:audit::scoring"

# Not listed on purpose: "leave critical findings out of the urgent count" is an equivalent
# mutant. urgent_occurrences only selects the 92 cap, and any critical finding already caps at 49.

[[mutation]]
id = "scoring-aggregated-level-a"
target = "src/audit/scoring.rs"
change = "count non-Level-A findings as Level A urgent when viewport scores are aggregated"
find = "v.level == crate::cli::WcagLevel::A\n                    && matches!(v.severity, Severity::Critical | Severity::High)"
replace = "v.level != crate::cli::WcagLevel::A\n                    && matches!(v.severity, Severity::Critical | Severity::High)"
killed_by = "lib:audit::scoring"

[[mutation]]
id = "penalty-fixed-ignores-cap"
target = "src/taxonomy/score.rs"
change = "fixed scaling ignores max_penalty"
find = "Scaling::Fixed => self.base_penalty.min(self.max_penalty),"
replace = "Scaling::Fixed => self.base_penalty,"
killed_by = "lib:taxonomy::score"

[[mutation]]
id = "penalty-phase2-rate"
target = "src/taxonomy/score.rs"
change = "double the penalty growth after saturation"
find = "phase2_count as f32 * self.base_penalty * PHASE2_RATE;"
replace = "phase2_count as f32 * self.base_penalty * PHASE2_RATE * 2.0;"
killed_by = "lib:taxonomy::score"

[[mutation]]
id = "penalty-total-ceiling"
target = "src/taxonomy/score.rs"
change = "raise the logarithmic ceiling from 2x to 3x max_penalty"
find = "(phase1 + phase2).min(self.max_penalty * 2.0)"
replace = "(phase1 + phase2).min(self.max_penalty * 3.0)"
killed_by = "lib:taxonomy::score"
