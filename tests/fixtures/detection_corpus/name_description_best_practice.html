<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Name and description best-practice corpus case</title>
</head>
<body>
    <main>
        <h1>Name and description best practice (#711, #713)</h1>

        <!-- title-only-description: the title attribute is the only descriptive text -->
        <button type="button" title="Search"><svg aria-hidden="true" width="10" height="10"></svg></button>

        <!-- description-duplicates-name: the button has a name, its description
             repeats it (Chrome drops a title equal to the name, aria-describedby not) -->
        <button type="button" aria-describedby="close-desc">Close</button>
        <span id="close-desc" hidden>Close</span>

        <!-- neither: title adds information beyond the name -->
        <button type="button" title="Opens the help page in a new window">Help</button>
        <!-- neither: a real <label> names the field, title only adds a hint (#711) -->
        <label for="kw">Keywords</label>
        <input id="kw" type="search" title="Search the whole portal">
        <input type="submit" value="Search" title="Start the search">
    </main>
</body>
</html>
