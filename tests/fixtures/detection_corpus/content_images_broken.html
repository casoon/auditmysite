<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exhibition with missing text alternatives</title>
    <style>
        @media (max-width: 600px) { .wide-only { display: none; } }
        @media (min-width: 601px) { .narrow-only { display: none; } }
        .icon { display: inline-block; width: 16px; height: 16px; background: #446; }
    </style>
    <style>
        nav a, .skip-link, form input { display: inline-block; min-width: 44px; min-height: 44px; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header>
        <p>City Library</p>
        <nav aria-label="Main"><a href="/" aria-current="page">Home</a> <a href="/catalogue">Catalogue</a> <a href="/visit">Visit</a></nav>
    </header>
    <main id="main">
        <h1>Exhibition: maps of the old town</h1>
        <img id="poster" src="/poster.jpg" width="200" height="120">
        <img id="file-alt" src="/map-1850.png" alt="map-1850.png" width="200" height="120">
        <img id="short-alt" src="/seal.png" alt="ab" width="40" height="40">
        <img id="filler-alt" src="/gate.png" alt="Image" width="40" height="40">
        <img id="wide-banner" class="wide-only" src="/banner-wide.jpg" width="300" height="60">
        <img id="narrow-banner" class="narrow-only" src="/banner-narrow.jpg" width="100" height="60">
        <img id="town-map" src="/town.png" usemap="#town-areas" alt="Old town districts" width="200" height="120">
        <map name="town-areas">
            <area id="area-market" href="/districts/market" shape="rect" coords="0,0,100,60">
            <area id="area-harbour" href="/districts/harbour" shape="rect" coords="100,0,200,60" alt="Harbour">
        </map>
        <a href="/maps/click"><img id="server-map" src="/clickable.png" ismap alt="Clickable town map" width="200" height="120"></a>
        <form action="/search">
            <label for="q">Search the collection</label>
            <input id="q" name="q" type="search">
            <input id="search-go" type="image" src="/go.png">
        </form>
        <object id="catalogue-pdf" data="/catalogue.pdf" type="application/pdf" width="300" height="200"></object>
        <audio id="welcome-audio" autoplay src="/welcome.mp3"></audio>
        <div id="stamp" role="img" class="icon"></div>
        <gallery-card></gallery-card>
        <iframe id="frame-gallery" title="Gallery" style="width:400px;height:120px;border:0" srcdoc="<!DOCTYPE html><html lang=&quot;en&quot;><head><title>Gallery</title></head><body><img id=&quot;frame-photo&quot; src=&quot;/frame.jpg&quot; width=&quot;80&quot; height=&quot;60&quot;><div id=&quot;frame-stamp&quot; role=&quot;img&quot; style=&quot;width:16px;height:16px;background:#446&quot;></div></body></html>"></iframe>
        <div id="late-images"></div>
        <script>
            customElements.define('gallery-card', class extends HTMLElement {
                connectedCallback() {
                    this.attachShadow({ mode: 'open' }).innerHTML =
                        '<img id="shadow-photo" src="/reading-room.jpg" width="120" height="80">';
                }
            });
            document.getElementById('late-images').innerHTML =
                '<img id="late-photo" src="/late.jpg" width="120" height="80">';
        </script>
    </main>
    <footer><p>City Library, 1 Market Square</p></footer>
</body>
</html>
