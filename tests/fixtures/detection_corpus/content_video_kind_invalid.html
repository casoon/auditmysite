<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library videos, track kinds as written</title>
    <style>
        nav a, .skip-link { display: inline-block; min-width: 44px; min-height: 44px; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header>
        <p>City Library</p>
        <nav aria-label="Main"><a href="/" aria-current="page">Home</a> <a href="/catalogue">Catalogue</a> <a href="/visit">Visit</a></nav>
    </header>
    <main id="main">
        <h1>Library videos</h1>
        <!-- An invalid kind is metadata (HTML invalid value default): with
             leading space or empty it is no caption track, even with a src
             that does not load. Keywords match ASCII case-insensitively. -->
        <video id="spaced" controls width="320" height="180" src="/spaced.mp4">
            <track kind=" captions" src="/spaced-captions" srclang="en" label="English">
        </video>
        <video id="empty" controls width="320" height="180" src="/empty.mp4">
            <track kind="" src="/empty-captions" srclang="en" label="English">
        </video>
        <video id="upper" controls width="320" height="180" src="/upper.mp4">
            <track kind="CAPTIONS" src="/upper.en.vtt" srclang="en" label="English">
        </video>
    </main>
    <footer><p>City Library, 1 Market Square</p></footer>
</body>
</html>
