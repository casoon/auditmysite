<title>Embedded sign-up widgets</title>
<style>
  body { font-family: sans-serif; color: #222; background: #fff; line-height: 1.5; margin: 0 16px; }

  .skip, nav a, .solo { display: inline-block; padding: 12px; min-height: 44px; min-width: 44px; box-sizing: border-box; }
  button, input, select, textarea, [role="button"], [role="textbox"], [role="radio"], [role="link"], [role="searchbox"] {
    display: inline-block; min-height: 44px; min-width: 44px; box-sizing: border-box; font-size: 1rem; }
  input[type="checkbox"], input[type="radio"] { width: 44px; height: 44px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  a.plain { text-decoration: none; }
  main p { color: #000; }
</style>

<h1>Embedded sign-up widgets</h1>
<!-- G2 #783 frames and shadow DOM: the same patterns inside an open shadow root and inside a same-origin iframe are content of the page and are judged like the top document. -->
<div id="shadow-host"><template shadowrootmode="open"><style>

  a.plain { text-decoration: none; }
  p { color: #000; }
</style>
<form id="sd-form-a" action="/a" method="post">
  <p><input id="sd-unlabelled" name="sd-x" type="text"></p>
  <p><input id="sd-placeholder" name="sd-v" type="text" placeholder="Voucher code"></p>
  <p><input id="sd-titled" name="sd-d" type="text" title="Door code"></p>
  <p><label for="sd-bad-ac">Company</label> <input id="sd-bad-ac" name="sd-c" type="text" autocomplete="company"></p>
  <p><label for="sd-mail">Email for updates</label> <input id="sd-mail" name="sd-m" type="email"></p>
  <p><label for="sd-invalid">Team code</label> <input id="sd-invalid" name="sd-t" type="text" aria-invalid="true"></p>
  <label><input type="radio" name="sd-freq" id="sd-radio" value="d"> Daily</label>
  <fieldset id="sd-fieldset"><label><input type="checkbox" name="sd-dig" id="sd-digest"> Weekly digest</label></fieldset>
  <p><label for="sd-required">Shirt size</label> <input id="sd-required" name="sd-s" type="text" required></p>
  <p><label for="sd-date">Start date</label> <input id="sd-date" name="sd-sd" type="text"></p>
  <p><label for="sd-jump">Jump to section</label> <select id="sd-jump" name="sd-j" onchange="location.href = this.value"><option value="#a">Bikes</option><option value="#b">Helmets</option></select></p>
  <p><button type="submit">Save</button></p>
</form>
<form id="sd-form-nosubmit" action="/n" method="post"><p><label for="sd-ns">Coupon</label> <input id="sd-ns" name="sd-ns" type="text"></p></form>
<form id="sd-form-twice" action="/o" method="post">
  <p><label for="sd-m1">Email</label> <input id="sd-m1" name="sd-m1" type="email" autocomplete="off"></p>
  <p><label for="sd-m2">Email for the invoice</label> <input id="sd-m2" name="sd-m2" type="email" autocomplete="off"></p>
  <p><button type="submit">Order</button></p>
</form>
<form id="sd-login" action="/login" method="post">
  <p><label for="sd-pw">Password</label> <input id="sd-pw" name="sd-pw" type="password" autocomplete="current-password" onpaste="return false"></p>
  <div class="g-recaptcha" data-sitekey="demo-key"></div>
  <p><button type="submit">Sign in</button></p>
</form>
<div id="sd-focus" tabindex="-1" onfocus="this.dataset.seen = 'yes'">Spring promotion</div>
<p><button id="sd-autofocus" type="button" autofocus>Continue</button></p>
<p><a class="solo" id="sd-empty-link" href="/cart"></a></p>
<p><button id="sd-empty-button" type="button"></button></p>
<p><a class="solo" id="sd-generic" href="/offers">Click here</a></p>
<div><div><ul><li><a class="solo" id="sd-url" href="https://example.org/report">https://example.org/report</a></li></ul></div></div>
<p><a class="solo" id="sd-single" href="/close-offer">x</a></p>
<p><a class="solo" id="sd-new-window" href="https://example.org/partner" target="_blank">Partner programme</a></p>
<p><a class="solo" id="sd-fake" href="#" onclick="return false;">Chat with us</a></p>
<p>Please read our <a id="sd-color" class="plain" href="/policy">privacy policy</a> before you place an order.</p>
