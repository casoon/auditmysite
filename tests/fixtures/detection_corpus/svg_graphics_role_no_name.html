<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SVG with explicit graphics role and no accessible name</title>
</head>
<body>
    <main>
        <h1>SVG with role="graphics-document" and no title/aria-label</h1>
        <svg role="graphics-document" width="120" height="80" viewBox="0 0 120 80">
            <rect x="0" y="0" width="120" height="80" fill="steelblue"></rect>
        </svg>
    </main>
</body>
</html>
