<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess board turned sideways in one orientation</title>
<style>
  body { color: #111111; background: #ffffff; }
  .tile { display: inline-block; width: 120px; height: 120px; margin: 40px; }
  /* A slight base tilt, turned a quarter further in landscape only: the
     board stays in place when the device turns (ACT b33eff, Failed 3). */
  .board { transform: rotate(2.5deg); }
  @media (orientation: landscape) {
    .board { transform: rotate(92.5deg); }
  }
  /* The rotate property instead of transform (ACT b33eff, Failed 4). */
  @media (orientation: portrait) {
    #clock { rotate: 90deg; }
  }
  /* A further condition next to the orientation that the check does not
     decide: a review, not a violation. */
  @media (orientation: portrait) and (max-width: 600px) {
    #ticket { transform: rotate(90deg); }
  }
</style>
</head>
<body>
<header>
  <a href="#main" style="display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px; padding: 0 8px">Skip to main content</a>
  <p>Chess club</p>
  <nav aria-label="Main"><a href="#main" aria-current="page" style="display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px; padding: 0 8px">Overview</a></nav>
</header>
<main id="main">
  <h1>Tonight's game</h1>
  <div id="board" class="board tile">Board</div>
  <div id="clock" class="tile">Clock</div>
  <div id="ticket" class="tile">Ticket</div>
</main>
<footer><p>Footer text</p></footer>
</body>
</html>
