<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // The viewport is written by a script (app shell), and it locks zooming.
  var vp = document.createElement('meta');
  vp.id = 'vp';
  vp.name = 'viewport';
  vp.content = 'width=device-width, initial-scale=1, maximum-scale=1';
  document.head.appendChild(vp);
</script>
<title>Viewport inserted by a script</title>
</head>
<body>
<header>
  <a href="#main" style="display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px; padding: 0 8px">Skip to main content</a>
  <p>Recipe collection</p>
  <nav aria-label="Main"><a href="#main" aria-current="page" style="display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px; padding: 0 8px">Overview</a></nav>
</header>
<main id="main">
  <h1>Viewport inserted by a script</h1>
  <p>Mix flour, water and salt, then let the dough rest for an hour.</p>
</main>
<footer><p>Footer text</p></footer>
</body>
</html>
