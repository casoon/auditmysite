<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focusable under aria-hidden</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 16px; color: #111; background: #fff; }
        a { display: inline-block; min-width: 44px; min-height: 44px; padding: 12px; box-sizing: border-box; }
    </style>
</head>
<body>
    <main>
        <h1>Order your delivery</h1>
        <!-- violation: a link inside an aria-hidden container is reachable by Tab -->
        <div aria-hidden="true">
            <a id="hf-link" href="/help">Delivery help</a>
        </div>
    </main>
</body>
</html>
