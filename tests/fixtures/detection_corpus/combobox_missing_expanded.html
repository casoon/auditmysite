<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Combobox missing aria-expanded corpus case</title>
</head>
<body>
    <main>
        <h1>Combobox without aria-expanded</h1>
        <div role="combobox" aria-controls="listbox1" tabindex="0">Choose a fruit</div>
        <ul id="listbox1" role="listbox">
            <li role="option">Apple</li>
            <li role="option">Banana</li>
        </ul>
    </main>
</body>
</html>
