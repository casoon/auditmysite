<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Reduced motion: transform animation with override</title>
    <style>
        /* #712: same motion, neutralised under prefers-reduced-motion: reduce */
        .card { transition: transform 0.3s ease; }
        .card:hover { transform: translateY(-4px); }
        .slide-in { animation: slide-in 1s ease-out; }
        @keyframes slide-in { from { transform: translateX(-100%); } to { transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
            .slide-in { animation: none; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Transform animation with reduced-motion override</h1>
        <div class="card">Card that lifts on hover</div>
        <div class="slide-in">Panel sliding in</div>
    </main>
</body>
</html>
