<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Media and motion corpus case</title>
    <style>
        @media (orientation: landscape) {
            .landscape-only-hide { display: none; }
        }
        .spinner {
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        button { min-width: 44px; min-height: 44px; }
        *:focus {
            outline: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>Video, orientation lock, motion, and focus-outline removal</h1>
        <video src="/clip.mp4" controls></video>
        <div class="landscape-only-hide">Only shown in portrait orientation</div>
        <div class="spinner">Loading…</div>
        <button>Focusable button with no visible focus indicator</button>
    </main>
</body>
</html>
