<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promotion box with a fixed width</title>
<style>
  body { color: #111111; background: #ffffff; }
  #promo { width: 600px; border: 1px solid #111111; padding: 8px; }
</style>
</head>
<body>
<header>
  <a href="#main" style="display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px; padding: 0 8px">Skip to main content</a>
  <p>Shop</p>
  <nav aria-label="Main"><a href="#main" aria-current="page" style="display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px; padding: 0 8px">Overview</a></nav>
</header>
<main id="main">
  <h1>Autumn offers</h1>
  <div id="promo"><p>All garden furniture is twenty percent off until Sunday.</p></div>
</main>
<footer><p>Footer text</p></footer>
</body>
</html>
