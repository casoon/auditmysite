<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Forms and misc corpus case</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>
  /* #783: page shell, so the case only reports what it is about */
  .skip, nav a { display: inline-block; padding: 12px; min-height: 44px; min-width: 44px; box-sizing: border-box; }
  button, input, select, textarea { min-height: 44px; min-width: 44px; box-sizing: border-box; }
  input[type="checkbox"], input[type="radio"] { width: 44px; height: 44px; }
</style>
</head>
<body>
    <header><p>Example Shop</p></header>
    <nav>
        <a href="/a">Section A</a>
        <a href="/b">Section B</a>
        <a href="/c">Section C</a>
    </nav>
    <main>
        <h1>Various form and misc issues</h1>

        <!-- duplicate-id-aria: two owners claim the same aria-owns target -->
        <div aria-owns="shared-target">Owner 1</div>
        <div aria-owns="shared-target">Owner 2</div>
        <div id="shared-target">Target</div>

        <form>
            <!-- autocomplete-valid -->
            <label for="misc1">Misc field</label>
            <input type="text" id="misc1" autocomplete="not-a-real-token">

            <!-- identify-purpose + help: personal-data input, no autocomplete/describedby -->
            <label for="user-email">Email</label>
            <input type="email" id="user-email" name="user_email">

            <!-- label-title-only -->
            <input type="text" title="Search field only">

            <!-- form-field-group (grouped radios without fieldset/legend) -->
            <input type="radio" name="color" id="c1"><label for="c1">Red</label>
            <input type="radio" name="color" id="c2"><label for="c2">Blue</label>

            <!-- label-in-name/mismatch -->
            <button aria-label="Submit the entire form now">Send</button>
        </form>

        <!-- content-on-hover-focus: role="tooltip" not referenced by aria-describedby -->
        <div role="tooltip" id="orphan-tip">Never announced</div>

        <!-- server-side-image-map -->
        <a href="/map"><img src="map.png" ismap alt="Site map"></a>
    </main>
<footer><p>Example Shop, 2026</p></footer>
</body>
</html>
