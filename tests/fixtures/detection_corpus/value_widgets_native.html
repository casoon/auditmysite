<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Native value widgets corpus case</title>
</head>
<body>
    <main>
        <h1>Native range, number and date inputs</h1>
        <!-- Native controls expose their value without aria-valuenow, and the
             day/month/year fields of a date input are the browser's (#656). -->
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="10">
        <label for="zoom">Zoom</label>
        <input id="zoom" type="range" role="slider" value="3" min="0" max="10">
        <label for="qty">Quantity</label>
        <input id="qty" type="number">
        <label for="amount">Amount</label>
        <input id="amount" type="number" value="4">
        <input type="date" aria-label="Order date value">
        <label for="time">Pickup time</label>
        <input id="time" type="time">
        <label for="month">Billing month</label>
        <input id="month" type="month">
        <label for="week">Calendar week</label>
        <input id="week" type="week">
        <label for="appointment">Appointment</label>
        <input id="appointment" type="datetime-local">
        <label for="disk">Disk usage</label>
        <meter id="disk" value="0.6">60%</meter>
        <hr>
        <div role="slider" tabindex="0" aria-label="Custom with value"
             aria-valuenow="5" aria-valuemin="0" aria-valuemax="10"></div>
        <div role="slider" aria-label="Hidden custom slider" style="display:none"></div>
    </main>
</body>
</html>
