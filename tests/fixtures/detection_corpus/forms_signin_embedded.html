<!doctype html>
<html lang="en">
<head>

<title>Partner sign-in</title>
<style>
  body { font-family: sans-serif; color: #222; background: #fff; line-height: 1.5; margin: 0 16px; }

<main id="main">
<h1>Partner sign-in</h1>
<!-- G2 #783 frames and shadow DOM for 3.3.8: a password field that blocks paste inside a web component or a same-origin frame fails like one in the top document. -->
<div id="signin-widget"><template shadowrootmode="open"><style>input, button { min-height: 44px; min-width: 44px; }</style><form action="/login" method="post"><p><label for="pw-shadow">Password</label> <input id="pw-shadow" name="pw" type="password" autocomplete="current-password" onpaste="return false"></p><p><label for="pw-shadow-ok">Repeat password</label> <input id="pw-shadow-ok" name="pw2" type="password" autocomplete="current-password"></p><p><button type="submit">Sign in</button></p></form></template></div>
<iframe id="signin-frame" title="Partner sign-in form" width="100%" height="300" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;en&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;title&gt;Partner sign-in form&lt;/title&gt;&lt;style&gt;

    display: inline-block; min-height: 44px; min-width: 44px; box-sizing: border-box; font-size: 1rem; }
  input[type=&quot;checkbox&quot;], input[type=&quot;radio&quot;] { width: 44px; height: 44px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main&gt;&lt;form action=&quot;/login&quot; method=&quot;post&quot;&gt;&lt;p&gt;&lt;label for=&quot;pw-frame&quot;&gt;Password&lt;/label&gt; &lt;input id=&quot;pw-frame&quot; name=&quot;pw&quot; type=&quot;password&quot; autocomplete=&quot;current-password&quot; onpaste=&quot;return false&quot;&gt;&lt;/p&gt;&lt;p&gt;&lt;label for=&quot;pw-frame-ok&quot;&gt;Repeat password&lt;/label&gt; &lt;input id=&quot;pw-frame-ok&quot; name=&quot;pw2&quot; type=&quot;password&quot; autocomplete=&quot;current-password&quot;&gt;&lt;/p&gt;&lt;p&gt;&lt;button type=&quot;submit&quot;&gt;Sign in&lt;/button&gt;&lt;/p&gt;&lt;/form&gt;&lt;/main&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
