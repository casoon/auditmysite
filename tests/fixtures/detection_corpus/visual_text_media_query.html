<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justified text on wide screens only</title>
<style>
  body { color: #111111; background: #ffffff; }
  p { line-height: 1.6; }
  /* Wide screens (the desktop pass) get justified, tighter paragraphs. */
  @media (min-width: 900px) {
    main p { text-align: justify; line-height: 1.3; }
  }
</style>
</head>
<body>
<header>
  <a href="#main" style="display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px; padding: 0 8px">Skip to main content</a>
  <p>City library news</p>
  <nav aria-label="Main"><a href="#main" aria-current="page" style="display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px; padding: 0 8px">Overview</a></nav>
</header>
<main id="main">
  <h1>Opening of the new reading room</h1>
  <p>The new reading room on the second floor opens next Monday. It offers forty
     quiet desks, daylight from three sides and a small collection of local history.</p>
</main>
<footer><p>Footer text</p></footer>
</body>
</html>
