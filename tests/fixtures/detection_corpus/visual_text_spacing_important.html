<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening hours - Town library</title>
<style>
  body { color: #111111; background: #ffffff; font-size: 16px; }
</style>
</head>
<body>
<header>
  <a href="#main" style="display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px; padding: 0 8px">Skip to main content</a>
  <p>Town library</p>
  <nav aria-label="Main"><a href="#main" aria-current="page" style="display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px; padding: 0 8px">Overview</a></nav>
</header>
<main id="main">
  <h1>Opening hours</h1>
  <!-- Fixed below the 1.4.12 values with !important in the style attribute:
       a user style sheet cannot increase the spacing. -->
  <p id="letter" style="letter-spacing: 0.1em !important">The library is open Monday to Friday from 9:00 to 18:00.</p>
  <p id="word" style="word-spacing: normal !important">On Saturday it opens from 10:00 to 14:00.</p>
  <p id="line" style="line-height: 120% !important">On public holidays the library stays closed.</p>
  <!-- Positioned out of the flow: without layout it is open whether the
       text is visible at all. -->
  <p id="letter-positioned" style="position: absolute; top: -999em; letter-spacing: 0.1em !important">Books can be returned at the drop box.</p>
</main>
<footer><p>Footer text</p></footer>
</body>
</html>
