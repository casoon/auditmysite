<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Gradient text contrast corpus case</title>
    <style>
        body { background-color: #ffffff; color: #111111; }
        .logo {
            font-weight: 700;
            text-decoration: none;
            background-image: linear-gradient(90deg, #0b3d91, #6a1b9a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .fill-gradient {
            background-image: linear-gradient(90deg, #0b3d91, #6a1b9a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #ffffff;
        }
        .faint { color: #aaaaaa; }
    </style>
</head>
<body>
    <header>
        <nav aria-label="Main">
            <a id="logo-main" class="logo" href="/">Geographia</a>
            <a id="logo-module" class="fill-gradient" href="/atmosphere/">Atmosphere</a>
        </nav>
    </header>
    <main>
        <h1>Gradient logo text next to low-contrast body text</h1>
        <p id="faint-text" class="faint">
            This paragraph uses light gray text on a white background, well below
            the 4.5:1 contrast ratio required for normal-size body text.
        </p>
    </main>
</body>
</html>
