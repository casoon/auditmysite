<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Custom slider inside a shadow root corpus case</title>
</head>
<body>
    <main>
        <h1>Web component with a custom slider</h1>
        <x-volume>
            <template shadowrootmode="open">
                <div id="shadow-volume" role="slider" tabindex="0" aria-label="Volume"></div>
            </template>
        </x-volume>
    </main>
</body>
</html>
