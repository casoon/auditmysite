<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library reading room, background videos</title>
    <style>
        nav a, .skip-link { display: inline-block; min-width: 44px; min-height: 44px; }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header>
        <p>City Library</p>
        <nav aria-label="Main"><a href="/" aria-current="page">Home</a> <a href="/catalogue">Catalogue</a> <a href="/visit">Visit</a></nav>
    </header>
    <main id="main">
        <h1>Reading room</h1>
        <!-- Muted without controls: no sound anybody can turn on, so 1.2.2
             has nothing to caption, with or without a track. -->
        <video id="ambience" muted width="320" height="180" src="/ambience.mp4">
            <track kind="captions" src="/ambience-captions" srclang="en" label="English">
        </video>
        <video id="shelves" muted width="320" height="180" src="/shelves.mp4"></video>
        <p>The reading room is open every day from 9 to 18.</p>
    </main>
    <footer><p>City Library, 1 Market Square</p></footer>
</body>
</html>
