# cargo-deny configuration (#944). Checked in the `dependency-audit` job of
# .github/workflows/ci.yml: `cargo deny check licenses bans sources`.
# Advisories stay with `cargo audit` (.cargo/audit.toml), so they are not
# checked twice.

[graph]
# The optional `ai-transparency` feature (c2pa) adds the heaviest part of the
# tree; check it too.
all-features = true

[licenses]
# Derived from the real tree (`cargo deny list`), restricted to licences that
# some crate needs on its own or as the permissive branch of an OR expression.
# Copyleft that only occurs as an alternative (GPL-2.0-only in self_cell,
# LGPL-2.1-or-later in r-efi) is deliberately not allowed: both crates also
# offer Apache-2.0/MIT.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions come from the typst and c2pa trees and are not fixable
# here; reported, not enforced.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
