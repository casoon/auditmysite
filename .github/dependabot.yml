version: 2
updates:
  # The docs.rs build action is pinned to a commit, which is the safe way to
  # run someone else's Docker in CI — and also the way a pin quietly goes stale
  # while the action moves on. Dependabot is what watches it: it opens a PR when
  # the pinned commit is behind, and it does the same for the tagged actions
  # here, which are pins too, just movable ones.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # Cargo.lock is committed and `cargo audit` / `cargo deny` gate it in CI.
  # Monthly and grouped keeps the number of PRs (each one runs Quick CI) at a
  # few a month.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
      cargo-major:
        update-types:
          - major
