name: CI

# Full QA is opt-in between releases; release.yml calls this file from the
# exact tagged commit. Dispatch validates the selected ref and cannot publish.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Unique per invocation: manual QA, release calls and repeated dispatches
# never cancel or replace one another (including pending runs).
concurrency:
  group: full-qa-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

# Every `Install Rust toolchain` step runs `rustup toolchain install` without
# a toolchain argument, which installs the version, profile and components
# pinned in rust-toolchain.toml (plan/28-toolchain-package-hygiene.md).
# Incremental compilation stays off as it was under dtolnay/rust-toolchain:
# CI builds from scratch and would only bloat the cached `target/`.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (without PDF)
        run: cargo build --no-default-features

      - name: Run clippy
        run: cargo clippy --no-default-features -- -D warnings

      - name: Run tests
        run: cargo test --no-default-features -- --nocapture --test-threads=1

  check-all-features:
    name: Check & Test (all features)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-all-features-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (all features)
        run: cargo build --all-features

      - name: Run clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Raw HTML tags in doc comments break the rendered pages on docs.rs (#588);
      # broken doc links are the same class of defect, wrong where nobody looks.
      - name: Check rustdoc (all features)
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Run tests (production features, PDF smoke excluded)
        run: cargo test --features pdf,ai-transparency -- --nocapture --test-threads=1

  pdf-smoke:
    name: PDF Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pdf-smoke-${{ hashFiles('**/Cargo.lock') }}

      # poppler-utils (pdftoppm/pdftotext) powers the visual smoke checks
      # (#510: blank-page, page-budget, dual-viewport-gauge regression tests)
      # and the pdftotext-based content-traceability tests. Without it these
      # tests silently no-op (`find_executable("pdftoppm")` returns `None`)
      # rather than fail — installing it here is what makes them actually
      # run in CI instead of always being skipped.
      - name: Install poppler-utils (pdftoppm, pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run PDF smoke tests
        run: cargo test --features pdf_test -- --nocapture --test-threads=1

      - name: Upload visual regression debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-visual-debug
          path: target/pdf-visual-debug/
          if-no-files-found: ignore

  # The docs step in `check-all-features` builds on the runner: stable, no
  # memory ceiling, the working tree rather than the published package. docs.rs
  # builds nightly, inside a sandbox, from what `cargo package` produces, and
  # 1.5.1 used 4.75 GB of its 6.4 GB there. A build that dies at that ceiling
  # is only visible after `cargo publish`, and a published version cannot be
  # replaced — so this job asks docs.rs's own image the question beforehand.
  #
  # The action is in beta and pinned to a commit rather than a tag; failures do
  # not block the merge (`continue-on-error`) until it has proven itself.
  #
  # Tags only. The question is "will docs.rs manage to build this", and it is
  # worth answering once, where a wrong answer still costs something: right
  # before the version that gets published. On every pull request it would
  # spend seven runner minutes and a cache slot to re-answer it for a commit
  # nobody publishes. `github.ref` is the caller's ref when release.yml calls
  # this workflow, so the tag reaches here.
  docs-rs:
    name: docs.rs Build (sandbox parity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    # A composite action runs its steps in this job, with this job's token.
    # This one needs to read the checkout and nothing else, so that is all the
    # token can do here — the rest of the workflow keeps the repository default.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the docs the way docs.rs will
        uses: rust-lang/docs.rs/github-actions/build@6b0955898af88db642c5ce7420d9dbef2c65d5d9
        with:
          strict: true

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Check formatting
        run: cargo fmt -- --check

  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Check for unused dependencies
        run: cargo machete

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Ignore list lives in .cargo/audit.toml, with a comment per advisory
      # ID explaining why it isn't fixable yet (plan/24-dependency-security-
      # gate.md) — re-check those on failure before assuming they still apply.
      - name: Run cargo audit
        run: cargo audit

  integration-mocked:
    name: Mocked Integration Tests (no Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mocked-${{ hashFiles('**/Cargo.lock') }}

      - name: Run mocked integration tests
        run: cargo test --test integration_mocked --no-default-features -- --nocapture

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Measure coverage (unit tests + mocked integration)
        run: >
          cargo tarpaulin
          --no-default-features
          --tests
          --exclude-files 'src/output/*' 'src/i18n/*'
          --out xml
          --output-dir coverage/

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

  browser-smoke:
    name: Browser Integration Tests (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-browser-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run browser integration tests
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test integration_test -- --ignored --nocapture --test-threads=1

      - name: Run replay-path tests (fresh vs cache vs replay)
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test replay_paths_test -- --ignored --nocapture --test-threads=1

      # Schema/vulnerable-libs/easy-language detection-corpus tests
      # (#553-#558; the WCAG corpus has its own job below): real Chrome, diffed against ground-truth fixtures.
      # These are separate `#[ignore]`-gated test binaries and were never
      # actually exercised in CI before (only `integration_test` was) — a
      # real accuracy regression here could pass CI silently.
      # One step per binary, each running even after an earlier failure, so
      # one regression can't hide another (#582).
      - name: Detector error cases
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test rule_error_cases -- --include-ignored --nocapture --test-threads=1

      - name: Batch exit codes (CLI, failed URLs)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test batch_failed_urls_cli -- --ignored --nocapture --test-threads=1

      - name: Session policy (browser)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test session_policy_test -- --ignored --nocapture --test-threads=1

      - name: Perf runs (browser)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test perf_runs_browser -- --ignored --nocapture --test-threads=1

      - name: State changes (browser)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test state_changes_test -- --ignored --nocapture --test-threads=1

      - name: Capture collectors (browser)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test capture_collectors_browser -- --ignored --nocapture --test-threads=1

      # Browser selection, failover and pool reliability on the runner's real Chrome
      # (#854, #856). The detection test counts processes and profile directories of
      # its own process, so it must not share a process with other tests.
      - name: Browser detection, failover and pool (browser)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: |
          cargo test --test browser_detection_chrome --test browser_pool_test -- --ignored --nocapture --test-threads=1
          cargo test --lib browser::manager::failover_tests -- --ignored --nocapture --test-threads=1

      - name: Missing h1 and redirect transport (browser)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test missing_h1_browser --test transport_redirect_browser -- --ignored --nocapture --test-threads=1

      - name: Detection corpus (schema rules)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test schema_rules_detection_corpus_test -- --ignored --nocapture --test-threads=1

      - name: Detection corpus (vulnerable libs)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test vulnerable_libs_detection_corpus_test -- --ignored --nocapture --test-threads=1

      - name: Detection corpus (easy language)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test easy_language_detection_test -- --ignored --nocapture --test-threads=1

      # Help-mechanism inventory (WCAG 3.2.6, plan 54) and score calibration
      # bands (plan 47): real-Chrome `#[ignore]`-gated binaries that were not
      # run in CI before (plan 66, WP2).
      - name: Help mechanisms detection
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test help_mechanisms_detection_test -- --ignored --nocapture --test-threads=1

      - name: Score calibration bands
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test score_calibration_test -- --ignored --nocapture --test-threads=1

  # Strict WCAG detection corpus (#555, #783): about 200 cases at ~6 s each
  # through the real pipeline, too long for one job next to the other browser
  # suites. `CORPUS_SHARD` splits the sorted cases round-robin; the shards
  # together cover every case exactly once.
  detection-corpus:
    name: Detection corpus (WCAG) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-browser-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Detection corpus (WCAG)
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
          CORPUS_SHARD: ${{ matrix.shard }}/3
        run: cargo test --test detection_corpus_test -- --ignored --nocapture --test-threads=1

  # Test strength of the detectors (#783): every targeted mutation in the
  # rule contracts must turn its named test red. Rebuilds once per mutation,
  # so it runs for release tags only; the contract gate itself
  # (tests/rule_contract_gate.rs) runs in every `cargo test` above.
  mutation-check:
    name: Detector mutation check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-browser-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Targeted detector mutations
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: python3 scripts/mutation-check.py

  # One real browser run per supported platform (#854, #856; design in
  # docs/browser-pool.md). A cross-build is not a runtime test: each leg
  # builds natively, runs the ignored browser suites against the runner's
  # browser and audits a local fixture through the CLI, then checks that the
  # report's measurement profile names this very platform and browser.
  # Windows is Edge-only by the platform contract. Full QA only (this file has
  # no push/pull_request trigger), so the macOS/Windows minutes are spent on
  # release tags and manual dispatch; release.yml reaches it through
  # `quality-gates`, which `build` needs.
  native-browser-smoke:
    name: Native browser smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, runner: macos-15, browser: chrome, os: macos, arch: aarch64, products: "chrome chrome_for_testing" }
          - { name: Linux x64, runner: ubuntu-24.04, browser: chrome, os: linux, arch: x86_64, products: "chrome chrome_for_testing" }
          - { name: Linux arm64, runner: ubuntu-24.04-arm, browser: chrome, os: linux, arch: aarch64, products: "chrome chrome_for_testing chromium" }
          - { name: Windows x64, runner: windows-2025, browser: edge, os: windows, arch: x86_64, products: "edge" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.runner }}-cargo-native-smoke-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Chrome
        if: matrix.browser == 'chrome'
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      - name: Select browser
        id: browser
        shell: bash
        env:
          CHROME_PATH_FROM_SETUP: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          if [ "${{ matrix.browser }}" = "edge" ]; then
            path="C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
            version="$(powershell -NoProfile -Command "(Get-Item '$path').VersionInfo.ProductVersion" | tr -d '\r')"
          else
            path="$CHROME_PATH_FROM_SETUP"
            version="$("$path" --version | tr -d '\r')"
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Browser: $path ($version)"

      - name: Browser detection, failover and pool tests
        shell: bash
        env:
          AUDITMYSITE_BROWSER: ${{ steps.browser.outputs.path }}
          CI: "true"
        run: cargo test --no-default-features --test browser_detection_chrome --test browser_pool_test -- --ignored --nocapture --test-threads=1

      # Runs even when the test step failed: the legs report independently.
      # Exit code 1 is the WARN verdict of a finished audit (partial quality
      # of an optional module on a runner), 2 is FAIL; only a missing report
      # or a missing browser record fails this leg.
      - name: CLI audit of a local fixture
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        shell: bash
        env:
          AUDITMYSITE_BROWSER: ${{ steps.browser.outputs.path }}
        run: |
          cargo build --no-default-features
          exe="target/debug/auditmysite"
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          py="$(command -v python3 || command -v python)"
          "$py" -m http.server 8765 --bind 127.0.0.1 --directory tests/fixtures >/dev/null 2>&1 &
          server=$!
          sleep 2
          flags=""
          [ "$RUNNER_OS" = "Linux" ] && flags="--no-sandbox"
          status=0
          "$exe" http://127.0.0.1:8765/perfect.html --format json --output smoke-report.json $flags || status=$?
          kill "$server" || true
          echo "audit exit code: $status"
          [ "$status" -le 1 ]

      - name: Check the measurement profile names this platform and browser
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        shell: bash
        env:
          EXPECT_OS: ${{ matrix.os }}
          EXPECT_ARCH: ${{ matrix.arch }}
          EXPECT_PRODUCTS: ${{ matrix.products }}
        run: |
          py="$(command -v python3 || command -v python)"
          "$py" - <<'PY'
          import json, os, sys

          def find(node, key):
              if isinstance(node, dict):
                  if key in node:
                      return node[key]
                  for value in node.values():
                      found = find(value, key)
                      if found is not None:
                          return found
              elif isinstance(node, list):
                  for value in node:
                      found = find(value, key)
                      if found is not None:
                          return found
              return None

          report = json.load(open("smoke-report.json", encoding="utf-8"))
          profile = find(report, "measurement_profile")
          browser = (profile or {}).get("browser")
          if not browser:
              sys.exit("measurement_profile.browser is missing")
          json.dump(browser, open("smoke-browser.json", "w"))
          print(json.dumps(browser, indent=2))
          problems = []
          if browser.get("os") != os.environ["EXPECT_OS"]:
              problems.append(f"os {browser.get('os')} != {os.environ['EXPECT_OS']}")
          if browser.get("arch") != os.environ["EXPECT_ARCH"]:
              problems.append(f"arch {browser.get('arch')} != {os.environ['EXPECT_ARCH']}")
          if browser.get("product") not in os.environ["EXPECT_PRODUCTS"].split():
              problems.append(f"product {browser.get('product')} not in {os.environ['EXPECT_PRODUCTS']}")
          if not browser.get("version"):
              problems.append("browser version is empty")
          if problems:
              sys.exit("; ".join(problems))
          PY

      - name: Job summary
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BROWSER_VERSION: ${{ steps.browser.outputs.version }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Native browser smoke: ${{ matrix.name }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | ${{ matrix.runner }} |"
            echo "| OS / arch | $RUNNER_OS / $RUNNER_ARCH |"
            echo "| Browser (runner) | $BROWSER_VERSION |"
            echo "| Commit | $GITHUB_SHA |"
            echo "| Job status so far | $JOB_STATUS |"
            if [ -f smoke-browser.json ]; then
              echo
              echo "Browser as recorded in \`measurement_profile.browser\`:"
              echo '```json'
              cat smoke-browser.json
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
