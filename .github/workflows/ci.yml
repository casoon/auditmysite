name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets release.yml gate a release build on this exact workflow passing for
  # the tagged commit's own SHA (plan/25-release-workflow-quality-gate.md) —
  # a `uses: ./.github/workflows/ci.yml` call runs against the calling
  # workflow's checkout, not a separate lookup by branch name. The
  # `browser-smoke`/`coverage` jobs' own `if: github.event_name == 'push' ||
  # ... == 'pull_request'` guards mean they don't re-run for a
  # `workflow_call` — those real-Chrome/coverage checks already ran when
  # this commit was pushed to `main`, and are covered again locally by the
  # pre-push hook's `scripts/release-check.sh` before a release tag is ever
  # pushed; re-running them here would slow every release down for checks
  # that already passed.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (without PDF)
        run: cargo build --no-default-features

      - name: Run clippy
        run: cargo clippy --no-default-features -- -D warnings

      - name: Run tests
        run: cargo test --no-default-features -- --nocapture --test-threads=1

  check-all-features:
    name: Check & Test (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-all-features-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (all features)
        run: cargo build --all-features

      - name: Run clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Raw HTML tags in doc comments break the rendered pages on docs.rs (#588);
      # broken doc links are the same class of defect, wrong where nobody looks.
      - name: Check rustdoc (all features)
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Run tests (all features, PDF smoke excluded)
        run: cargo test --features pdf -- --nocapture --test-threads=1

  pdf-smoke:
    name: PDF Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pdf-smoke-${{ hashFiles('**/Cargo.lock') }}

      # poppler-utils (pdftoppm/pdftotext) powers the visual smoke checks
      # (#510: blank-page, page-budget, dual-viewport-gauge regression tests)
      # and the pdftotext-based content-traceability tests. Without it these
      # tests silently no-op (`find_executable("pdftoppm")` returns `None`)
      # rather than fail — installing it here is what makes them actually
      # run in CI instead of always being skipped.
      - name: Install poppler-utils (pdftoppm, pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run PDF smoke tests
        run: cargo test --features pdf_test -- --nocapture --test-threads=1

      - name: Upload visual regression debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-visual-debug
          path: target/pdf-visual-debug/
          if-no-files-found: ignore

  # The docs step in `check-all-features` builds on the runner: stable, no
  # memory ceiling, the working tree rather than the published package. docs.rs
  # builds nightly, inside a sandbox, from what `cargo package` produces, and
  # 1.5.1 used 4.75 GB of its 6.4 GB there. A build that dies at that ceiling
  # is only visible after `cargo publish`, and a published version cannot be
  # replaced — so this job asks docs.rs's own image the question beforehand.
  #
  # The action is in beta and pinned to a commit rather than a tag; failures do
  # not block the merge (`continue-on-error`) until it has proven itself.
  #
  # Tags only. The question is "will docs.rs manage to build this", and it is
  # worth answering once, where a wrong answer still costs something: right
  # before the version that gets published. On every pull request it would
  # spend seven runner minutes and a cache slot to re-answer it for a commit
  # nobody publishes. `github.ref` is the caller's ref when release.yml calls
  # this workflow, so the tag reaches here.
  docs-rs:
    name: docs.rs Build (sandbox parity)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    # A composite action runs its steps in this job, with this job's token.
    # This one needs to read the checkout and nothing else, so that is all the
    # token can do here — the rest of the workflow keeps the repository default.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build the docs the way docs.rs will
        uses: rust-lang/docs.rs/github-actions/build@a80e3fda4b96c307a0e1cd663166cfda9fc1c7ce
        with:
          strict: true

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Check for unused dependencies
        run: cargo machete

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Ignore list lives in .cargo/audit.toml, with a comment per advisory
      # ID explaining why it isn't fixable yet (plan/24-dependency-security-
      # gate.md) — re-check those on failure before assuming they still apply.
      - name: Run cargo audit
        run: cargo audit

  integration-mocked:
    name: Mocked Integration Tests (no Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mocked-${{ hashFiles('**/Cargo.lock') }}

      - name: Run mocked integration tests
        run: cargo test --test integration_mocked --no-default-features -- --nocapture

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Measure coverage (unit tests + mocked integration)
        run: >
          cargo tarpaulin
          --no-default-features
          --tests
          --exclude-files 'src/output/*' 'src/i18n/*'
          --out xml
          --output-dir coverage/

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

  browser-smoke:
    name: Browser Integration Tests (E2E)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-browser-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run browser integration tests
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test integration_test -- --ignored --nocapture --test-threads=1

      # WCAG/schema/vulnerable-libs/easy-language detection-corpus tests
      # (#553-#558): real Chrome, diffed against ground-truth fixtures.
      # These are separate `#[ignore]`-gated test binaries and were never
      # actually exercised in CI before (only `integration_test` was) — a
      # real accuracy regression here could pass CI silently.
      # One step per binary, each running even after an earlier failure, so
      # one regression can't hide another (#582).
      - name: Detection corpus (WCAG)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test detection_corpus_test -- --ignored --nocapture --test-threads=1

      - name: Detection corpus (schema rules)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test schema_rules_detection_corpus_test -- --ignored --nocapture --test-threads=1

      - name: Detection corpus (vulnerable libs)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test vulnerable_libs_detection_corpus_test -- --ignored --nocapture --test-threads=1

      - name: Detection corpus (easy language)
        if: ${{ !cancelled() && steps.setup-chrome.outcome == 'success' }}
        env:
          AUDITMYSITE_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI: "true"
        run: cargo test --test easy_language_detection_test -- --ignored --nocapture --test-threads=1

