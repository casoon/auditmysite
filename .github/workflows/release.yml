name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Every `Install Rust toolchain` step runs `rustup toolchain install` without
# a toolchain argument, which installs the version, profile and components
# pinned in rust-toolchain.toml.
# Incremental compilation stays off as it was under dtolnay/rust-toolchain:
# CI builds from scratch and would only bloat the cached `target/`.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-version:
    name: Verify Tag Matches Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare tag with package version
        run: ./scripts/check-version-match.sh

      - name: Verify completed 2.0 prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-v2-readiness.py --version "$GITHUB_REF_NAME"

  # Runs the CI job set (fmt, clippy, tests without and with PDF,
  # dependency-audit, browser integration and detection-corpus tests, ...)
  # against this exact tagged commit before any artifact is built
  # — a `v*` tag pushed
  # straight from a branch that never went through CI must not be able to
  # produce a release. Only `coverage` is skipped for tags; it is a
  # measurement, not a gate.
  quality-gates:
    name: Quality Gates (full CI)
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [verify-version, quality-gates]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Only this job signs: id-token/attestations let it attach Sigstore build
    # provenance to the archives it builds (release-integrity, #945).
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        # Pinned to a reviewed commit (plan 94): cross has had no release
        # since v0.2.5 (2023-02-04), which is why it is installed from git;
        # unpinned, every new commit on cross-rs/main went straight into the
        # signed aarch64 binary. 526d03dd = main on 2026-10-14 ("Bump musl
        # libc and gcc version for *-musl targets", #1799). Bump deliberately.
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 526d03ddcd2f70e683074b3ea6f75ed300f33132 --locked

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY_NAME="auditmysite"
          TARGET="${{ matrix.target }}"
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="${BINARY_NAME}-${VERSION}-${TARGET}.tar.gz"

          cp "target/${TARGET}/release/${BINARY_NAME}" .
          tar -czf "${ARCHIVE_NAME}" "${BINARY_NAME}"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BINARY_NAME = "auditmysite.exe"
          $TARGET = "${{ matrix.target }}"
          $VERSION = "$env:GITHUB_REF_NAME"
          $ARCHIVE_NAME = "auditmysite-${VERSION}-${TARGET}.zip"

          Copy-Item "target/${TARGET}/release/${BINARY_NAME}" .
          Compress-Archive -Path $BINARY_NAME -DestinationPath $ARCHIVE_NAME
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $env:GITHUB_ENV

      - name: Generate SHA256 checksum (Unix)
        if: runner.os != 'Windows'
        run: shasum -a 256 "${{ env.ARCHIVE_NAME }}" > "${{ env.ARCHIVE_NAME }}.sha256"

      - name: Generate SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ env.ARCHIVE_NAME }}" -Algorithm SHA256).Hash.ToLower()
          # LF line ending, like shasum on Unix, so the aggregate SHA256SUMS
          # and `sha256sum -c` accept the line.
          [System.IO.File]::WriteAllText("${{ env.ARCHIVE_NAME }}.sha256", "$hash  ${{ env.ARCHIVE_NAME }}`n")

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # Aggregate of the per-archive .sha256 files (which install.sh keeps
      # verifying). Checked once here so a malformed line fails the release
      # before anything is published.
      - name: Create SHA256SUMS
        working-directory: artifacts
        run: |
          cat ./*.sha256 | tr -d '\r' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: artifacts/*

  # Container image (#927): the released binary plus Chromium, built from the
  # Dockerfile after the release exists because the Dockerfile downloads and
  # verifies that release's archive. Tags only (this workflow runs on nothing
  # else); the image gets Sigstore build provenance like the archives.
  image:
    name: Publish container image
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/casoon/auditmysite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (arm64 image)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # vX.Y.Z -> :X.Y.Z; :latest only for final versions, never for a
      # pre-release such as v2.1.0-rc.1.
      - name: Compute image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="${IMAGE}:${version}"
          case "$version" in
            *-*) ;;
            *) tags="${tags}"$'\n'"${IMAGE}:latest" ;;
          esac
          {
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.list }}
          push: true
          # The Sigstore attestation below replaces BuildKit's own provenance
          # manifest, which would show up as an extra "unknown/unknown" entry.
          provenance: false

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
