name: Set up Rust
description: >-
  Installs the toolchain pinned in rust-toolchain.toml and restores the cargo
  registry and target cache. Run actions/checkout first.

inputs:
  cache-name:
    description: Cache family; the key is <os>-<cache-name>-<hash of every Cargo.lock>.
    required: true

runs:
  using: composite
  steps:
    # No toolchain argument: installs the version, profile and components
    # pinned in rust-toolchain.toml.
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install --no-self-update

    - name: Cache cargo registry & build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ inputs.cache-name }}-${{ hashFiles('**/Cargo.lock') }}
